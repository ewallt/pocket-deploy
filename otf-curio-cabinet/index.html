<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Curio Cabinet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* --- CABINET THEME --- */
        :root {
            --bg-page: #1c1917;        /* Dark Wood/Shadow */
            --bg-card: #292524;        /* Dark Stone */
            --text-main: #e7e5e4;      /* Bone White */
            --text-muted: #a8a29e;     /* Dust */
            
            --accent-gold: #d4af37;    /* Gold Leaf */
            --accent-red: #9f1239;     /* Velvet Red */
            --accent-green: #15803d;   /* Felt Green */
            
            --border: #44403c;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Lato', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        .display-font { font-family: 'Cinzel', serif; }

        /* --- UI COMPONENTS --- */
        .container-max {
            max-width: 900px;
            margin: 0 auto;
        }

        .play-btn {
            background-color: transparent;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 1rem 3rem;
            border: 2px solid var(--accent-gold);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .play-btn:hover {
            background-color: var(--accent-gold);
            color: var(--bg-page);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        /* --- CARD GRID --- */
        .cabinet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .artifact-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 2rem;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .artifact-card:hover {
            transform: translateY(-4px);
            border-color: var(--text-muted);
        }

        /* STATES */
        .artifact-card.revealed-true {
            border-color: var(--accent-green);
            background: rgba(21, 128, 61, 0.1);
            cursor: default;
        }
        .artifact-card.revealed-fake {
            border-color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.1);
            cursor: default;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
        }
        
        /* CONTENT STYLES */
        .fact-text {
            font-size: 1.25rem;
            line-height: 1.4;
            font-family: 'Playfair Display', serif;
            margin-bottom: 1rem;
        }

        .reveal-text {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            margin-bottom: 0.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        
        .explanation {
            font-size: 0.9rem;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.5s ease 0.2s;
        }

        /* Show content on reveal */
        .revealed-true .reveal-text, .revealed-fake .reveal-text { opacity: 1; transform: translateY(0); }
        .revealed-true .explanation, .revealed-fake .explanation { opacity: 1; }

        .true-badge { color: var(--accent-green); }
        .fake-badge { color: var(--accent-gold); }

        /* --- ANIMATIONS --- */
        .spinner {
            width: 40px; height: 40px; 
            border: 2px solid var(--border); 
            border-top-color: var(--accent-gold); 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.8s ease forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body class="min-h-screen py-12 px-6 flex flex-col items-center">

    <header class="text-center mb-10 container-max">
        <h1 class="text-5xl mb-2 display-font text-[var(--accent-gold)]">The Curio Cabinet</h1>
        <p class="text-sm uppercase tracking-[0.3em] text-[var(--text-muted)] mb-8">Identify the Fabrication</p>
        
        <div id="controls">
            <button onclick="startGame()" id="btn-play" class="play-btn">Open Cabinet</button>
        </div>
        
        <div id="score-display" class="hidden mt-4 serif italic text-[var(--text-muted)]">
            Find the fake to win the round.
        </div>
    </header>

    <div id="view-loading" class="hidden text-center my-20">
        <div class="spinner mb-6"></div>
        <p class="display-font text-xs tracking-widest text-[var(--accent-gold)]">Curating Artifacts...</p>
        <p class="text-xs text-[var(--text-muted)] mt-2">Forging 1 fake • Verifying 3 truths</p>
    </div>

    <div id="view-board" class="container-max hidden">
        <div id="card-grid" class="cabinet-grid">
            </div>
        
        <div id="next-round-area" class="text-center mt-12 hidden fade-in">
            <h3 class="text-2xl serif italic text-[var(--accent-gold)] mb-4">You found the forgery.</h3>
            <button onclick="startGame()" class="play-btn text-sm py-3 px-8">Next Collection</button>
        </div>
    </div>

<script>
    const API_KEY = "AIzaSyBjL7zhEjoBgqCaXCxID3hV9KZNaPm5M8A";
    
    let gameState = {
        gameOver: false,
        cards: []
    };

    async function startGame() {
        const btn = document.getElementById('btn-play');
        const loader = document.getElementById('view-loading');
        const board = document.getElementById('view-board');
        const grid = document.getElementById('card-grid');
        const nextArea = document.getElementById('next-round-area');
        const scoreDisplay = document.getElementById('score-display');

        // Reset UI
        btn.classList.add('hidden');
        scoreDisplay.classList.remove('hidden');
        nextArea.classList.add('hidden');
        grid.innerHTML = '';
        loader.classList.remove('hidden');
        board.classList.add('hidden');
        
        gameState.gameOver = false;

        try {
            const prompt = `
                Role: The Trickster Curator.
                Goal: Create a "Find the Fake" trivia round.
                
                Task: Generate 4 facts.
                - 3 MUST be TRUE (Verifiable, specific, reputable sources like Smithsonian/Britannica).
                - 1 MUST be FAKE (A specific, plausible hallucination that sounds scientific/historical but is made up).
                
                CRITERIA:
                - The True facts should sound surprising (counter-intuitive).
                - The Fake fact should sound plausible (using real terminology).
                - Topics: Mix of History, Science, Nature, Language.
                
                RETURN JSON ONLY:
                [
                    {
                        "text": "The Eiffel Tower grows up to 6 inches in summer due to thermal expansion.",
                        "type": "TRUE",
                        "reveal": "Physics / Material Science",
                        "explain": "Source: Smithsonian Mag. Iron expands when heated."
                    },
                    {
                        "text": "Napoleon Bonaparte was attacked by a horde of bunnies.",
                        "type": "TRUE",
                        "reveal": "History",
                        "explain": "Source: Mental Floss. He organized a rabbit hunt, but the tame rabbits swarmed him for food."
                    },
                    {
                        "text": "The 'Quantum Dolphin' is the only mammal capable of photosynthesizing sunlight.",
                        "type": "FAKE",
                        "reveal": "COMPLETE FABRICATION",
                        "explain": "This is a lie. No mammal can photosynthesize."
                    }
                ]
            `;

            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                }
            );

            const data = await response.json();
            let facts = JSON.parse(data.candidates[0].content.parts[0].text);
            
            // Shuffle in JS to ensure the fake isn't always in the same JSON position
            facts = shuffleArray(facts);
            
            renderCards(facts);

            loader.classList.add('hidden');
            board.classList.remove('hidden');

        } catch (e) {
            console.error(e);
            alert("The Curator dropped the artifacts. Please try again.");
            loader.classList.add('hidden');
            btn.classList.remove('hidden');
        }
    }

    function renderCards(facts) {
        const grid = document.getElementById('card-grid');
        grid.innerHTML = '';

        facts.forEach((fact, index) => {
            const card = document.createElement('div');
            card.className = 'artifact-card fade-in';
            card.style.animationDelay = `${index * 100}ms`;
            
            card.innerHTML = `
                <div class="content-wrapper">
                    <p class="fact-text">"${fact.text}"</p>
                    
                    <div class="reveal-info">
                        <div class="reveal-text ${fact.type === 'TRUE' ? 'true-badge' : 'fake-badge'}">
                            ${fact.type === 'TRUE' ? '✓ VERIFIED REAL' : '⚠ FORGERY DETECTED'}
                        </div>
                        <p class="explanation">${fact.explain}</p>
                    </div>
                </div>
            `;

            card.onclick = () => handleCardClick(card, fact);
            grid.appendChild(card);
        });
    }

    function handleCardClick(cardElement, factData) {
        if (gameState.gameOver) return; // Round ended
        if (cardElement.classList.contains('revealed-true')) return; // Already clicked

        if (factData.type === 'TRUE') {
            // Player clicked a TRUE fact (keep playing)
            cardElement.classList.add('revealed-true');
        } else {
            // Player clicked the FAKE (Win!)
            cardElement.classList.add('revealed-fake');
            endRound();
        }
    }

    function endRound() {
        gameState.gameOver = true;
        document.getElementById('next-round-area').classList.remove('hidden');
        
        // Reveal all remaining cards nicely
        const allCards = document.querySelectorAll('.artifact-card');
        // Note: In a real game we might want to reveal them, but keeping them hidden 
        // forces the user to wonder about the others, or we can auto-reveal.
        // Let's leave them as-is to let the user click them if they want to read the source.
    }

    // Fisher-Yates Shuffle
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }
</script>
</body>
</html>
