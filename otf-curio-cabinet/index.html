<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Curio Cabinet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* --- CABINET THEME --- */
        :root {
            --bg-page: #1c1917;        /* Dark Wood/Shadow */
            --bg-card: #292524;        /* Dark Stone */
            --text-main: #e7e5e4;      /* Bone White */
            --text-muted: #a8a29e;     /* Dust */
            
            --accent-gold: #d4af37;    /* Gold Leaf */
            --accent-red: #9f1239;     /* Velvet Red */
            --accent-green: #15803d;   /* Felt Green */
            
            --border: #44403c;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Lato', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        .display-font { font-family: 'Cinzel', serif; }

        /* --- UI COMPONENTS --- */
        .container-max {
            max-width: 900px;
            margin: 0 auto;
        }

        .play-btn {
            background-color: transparent;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 1rem 3rem;
            border: 2px solid var(--accent-gold);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 300px;
        }
        .play-btn:hover {
            background-color: var(--accent-gold);
            color: var(--bg-page);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        /* --- SELECTOR --- */
        .domain-select {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            font-family: 'Lato', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            outline: none;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            margin-bottom: 1rem;
            text-align: center;
        }
        .domain-select:focus { border-color: var(--accent-gold); }

        /* --- CARD GRID --- */
        .cabinet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .artifact-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 2rem;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .artifact-card:hover {
            transform: translateY(-4px);
            border-color: var(--text-muted);
        }

        /* STATES */
        .artifact-card.revealed-true {
            border-color: var(--accent-green);
            background: rgba(21, 128, 61, 0.1);
            opacity: 0.6;
            cursor: default;
        }
        .artifact-card.revealed-fake {
            border-color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.15);
            cursor: default;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
            z-index: 10;
        }
        .artifact-card.user-selected {
            opacity: 1 !important;
            border-width: 2px;
        }
        
        /* CONTENT STYLES */
        .fact-text {
            font-size: 1.25rem;
            line-height: 1.4;
            font-family: 'Playfair Display', serif;
            margin-bottom: 1rem;
        }

        .reveal-text {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            margin-bottom: 0.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        
        .explanation {
            font-size: 0.9rem;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.5s ease 0.2s;
        }

        .revealed-true .reveal-text, .revealed-fake .reveal-text { opacity: 1; transform: translateY(0); }
        .revealed-true .explanation, .revealed-fake .explanation { opacity: 1; }

        .true-badge { color: var(--accent-green); }
        .fake-badge { color: var(--accent-gold); }

        #result-message {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            min-height: 2rem;
        }
        
        #topic-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .spinner {
            width: 40px; height: 40px; 
            border: 2px solid var(--border); 
            border-top-color: var(--accent-gold); 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.8s ease forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body class="min-h-screen py-12 px-6 flex flex-col items-center">

    <header class="text-center mb-10 container-max">
        <h1 class="text-5xl mb-2 display-font text-[var(--accent-gold)]">The Curio Cabinet</h1>
        <p class="text-sm uppercase tracking-[0.3em] text-[var(--text-muted)] mb-8">Identify the Fabrication</p>
        
        <div id="controls" class="flex flex-col items-center">
            <select id="domain-select" class="domain-select">
                <option value="ALL">✦ The Curator's Choice (Random)</option>
                <option value="SPACE">🚀 Space & Physics</option>
                <option value="HISTORY">🏛️ History & Culture</option>
                <option value="NATURE">🌿 Nature & Biology</option>
                <option value="ODDITIES">🔮 Oddities & Language</option>
            </select>
            <button onclick="startGame()" id="btn-play" class="play-btn">Open Cabinet</button>
        </div>
        
        <div id="score-display" class="hidden mt-4 serif italic text-[var(--text-muted)]">
            One attempt only. Choose wisely.
        </div>
    </header>

    <div id="view-loading" class="hidden text-center my-20">
        <div class="spinner mb-6"></div>
        <p class="display-font text-xs tracking-widest text-[var(--accent-gold)]">Consulting Archives...</p>
        <p id="loading-topic" class="text-xs text-[var(--text-muted)] mt-2">Loading...</p>
    </div>

    <div id="view-board" class="container-max hidden">
        <div class="text-center">
            <div id="topic-badge" class="hidden">Topic: Architecture</div>
        </div>

        <div id="card-grid" class="cabinet-grid"></div>
        
        <div id="next-round-area" class="text-center mt-12 hidden fade-in">
            <div id="result-message"></div>
            <button onclick="startGame()" class="play-btn text-sm py-3 px-8">Next Collection</button>
        </div>
    </div>

<script>
    const API_KEY = "AIzaSyBjL7zhEjoBgqCaXCxID3hV9KZNaPm5M8A";
    
    // EXTENDED SOURCE MAP (35+ Sources)
    const SOURCE_ROULETTE = [
        // SPACE & PHYSICS
        { category: "SPACE", label: "NASA Climate: Water & Oceans", promptContext: "NASA Climate Kids 'Water' section" },
        { category: "SPACE", label: "NASA Climate: Energy & Tech", promptContext: "NASA Climate Kids 'Energy' section" },
        { category: "SPACE", label: "NASA Climate: Atmosphere", promptContext: "NASA Climate Kids 'Atmosphere' section" },
        { category: "SPACE", label: "NASA Climate: Weather vs Climate", promptContext: "NASA Climate Kids 'Weather' section" },
        { category: "SPACE", label: "NASA Space Place: Solar System", promptContext: "NASA Space Place 'Solar System' facts" },
        { category: "SPACE", label: "NASA Space Place: Black Holes", promptContext: "NASA Space Place 'Black Holes' facts" },
        { category: "SPACE", label: "SciAm: Quantum Physics", promptContext: "Scientific American Physics & Quantum Mechanics" },
        { category: "SPACE", label: "SciAm: Astrophysics", promptContext: "Scientific American Space & Cosmology" },
        
        // HISTORY & CULTURE
        { category: "HISTORY", label: "Smithsonian: Ancient Civilizations", promptContext: "Smithsonian Magazine Archaeology & Ancient History" },
        { category: "HISTORY", label: "Smithsonian: American History", promptContext: "Smithsonian Magazine American History" },
        { category: "HISTORY", label: "Smithsonian: Innovation", promptContext: "Smithsonian Magazine Innovation & Technology" },
        { category: "HISTORY", label: "Mental Floss: Food History", promptContext: "Mental Floss Food History" },
        { category: "HISTORY", label: "Britannica: The Victorian Era", promptContext: "Britannica Victorian Era History" },
        { category: "HISTORY", label: "Britannica: The Middle Ages", promptContext: "Britannica Medieval History" },
        { category: "HISTORY", label: "Britannica: World Mythology", promptContext: "Britannica Mythology & Folklore" },
        { category: "HISTORY", label: "History Channel: Engineering Failures", promptContext: "History of Engineering Disasters" },

        // NATURE & BIOLOGY
        { category: "NATURE", label: "NASA Climate: Plants & Animals", promptContext: "NASA Climate Kids 'Plants and Animals'" },
        { category: "NATURE", label: "Britannica: Animal Kingdom", promptContext: "Britannica Zoology & Animal Behavior" },
        { category: "NATURE", label: "Britannica: Human Anatomy", promptContext: "Britannica Human Anatomy & Health" },
        { category: "NATURE", label: "SciAm: The Human Brain", promptContext: "Scientific American Mind & Neuroscience" },
        { category: "NATURE", label: "SciAm: Evolution", promptContext: "Scientific American Evolution & Paleontology" },
        { category: "NATURE", label: "NatGeo: Deep Sea", promptContext: "National Geographic Deep Sea & Oceans" },
        { category: "NATURE", label: "NatGeo: Insects", promptContext: "National Geographic Insects & Bugs" },
        { category: "NATURE", label: "Kew Gardens: Botany", promptContext: "Royal Botanic Gardens Plant Facts" },
        
        // ODDITIES & LANGUAGE
        { category: "ODDITIES", label: "Mental Floss: Language Quirks", promptContext: "Mental Floss Linguistics & Word Origins" },
        { category: "ODDITIES", label: "Mental Floss: Misconceptions", promptContext: "Mental Floss Common Misconceptions" },
        { category: "ODDITIES", label: "Atlas Obscura: Hidden Places", promptContext: "Atlas Obscura Hidden Places" },
        { category: "ODDITIES", label: "Atlas Obscura: Unusual Objects", promptContext: "Atlas Obscura Unusual Objects" },
        { category: "ODDITIES", label: "Guinness: Absurd Records", promptContext: "Guinness World Records Bizarre Categories" },
        { category: "ODDITIES", label: "Britannica: Psychology", promptContext: "Britannica Psychology & Human Behavior" }
    ];

    let gameState = { gameOver: false, cardsData: [] };

    async function startGame() {
        const btn = document.getElementById('btn-play');
        const selector = document.getElementById('domain-select');
        const loader = document.getElementById('view-loading');
        const board = document.getElementById('view-board');
        const grid = document.getElementById('card-grid');
        const nextArea = document.getElementById('next-round-area');
        const scoreDisplay = document.getElementById('score-display');
        const topicBadge = document.getElementById('topic-badge');
        const loadingTopic = document.getElementById('loading-topic');

        // Filter Sources based on User Selection
        const selectedDomain = selector.value;
        let pool = SOURCE_ROULETTE;
        
        if (selectedDomain !== 'ALL') {
            pool = SOURCE_ROULETTE.filter(s => s.category === selectedDomain);
        }

        // Pick Random Source from Pool
        const selection = pool[Math.floor(Math.random() * pool.length)];
        
        topicBadge.textContent = `Source: ${selection.label}`;
        loadingTopic.textContent = `Scanning: ${selection.label}`;

        // Reset UI
        btn.classList.add('hidden');
        selector.classList.add('hidden'); // Hide selector during play
        scoreDisplay.classList.remove('hidden');
        nextArea.classList.add('hidden');
        topicBadge.classList.add('hidden');
        grid.innerHTML = '';
        loader.classList.remove('hidden');
        board.classList.add('hidden');
        
        gameState.gameOver = false;
        gameState.cardsData = [];

        try {
            const prompt = `
                Role: The Trickster Curator.
                Goal: Create a "Find the Fake" trivia round based on a specific source.
                Seed: ${Math.random()}
                
                SOURCE CONTEXT: "${selection.promptContext}"
                
                Task: Generate 4 facts suitable for this source.
                - 3 MUST be TRUE facts that would be found in this specific section (Verifiable).
                - 1 MUST be FAKE (A plausible hallucination that fits the theme).
                
                CRITERIA:
                - The True facts should be specific, concrete, and surprising.
                - The Fake fact should use correct terminology to sound convincing.
                
                RETURN JSON ONLY:
                [
                    {
                        "text": "Fact text...",
                        "type": "TRUE",
                        "explain": "Source: [Site Name]. Brief explanation."
                    }
                ]
            `;

            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                }
            );

            const data = await response.json();
            let facts = JSON.parse(data.candidates[0].content.parts[0].text);
            
            facts = shuffleArray(facts);
            gameState.cardsData = facts;
            
            renderCards(facts);

            loader.classList.add('hidden');
            board.classList.remove('hidden');
            topicBadge.classList.remove('hidden');

        } catch (e) {
            console.error(e);
            alert("The Curator dropped the artifacts. Please try again.");
            loader.classList.add('hidden');
            btn.classList.remove('hidden');
            selector.classList.remove('hidden');
        }
    }

    function renderCards(facts) {
        const grid = document.getElementById('card-grid');
        grid.innerHTML = '';

        facts.forEach((fact, index) => {
            const card = document.createElement('div');
            card.className = 'artifact-card fade-in';
            card.style.animationDelay = `${index * 100}ms`;
            
            card.innerHTML = `
                <div class="content-wrapper">
                    <p class="fact-text">"${fact.text}"</p>
                    
                    <div class="reveal-info">
                        <div class="reveal-text ${fact.type === 'TRUE' ? 'true-badge' : 'fake-badge'}">
                            ${fact.type === 'TRUE' ? '✓ VERIFIED REAL' : '⚠ FORGERY DETECTED'}
                        </div>
                        <p class="explanation">${fact.explain}</p>
                    </div>
                </div>
            `;

            card.onclick = () => handleCardClick(card, fact, index);
            grid.appendChild(card);
        });
    }

    function handleCardClick(cardElement, factData, index) {
        if (gameState.gameOver) return; 

        gameState.gameOver = true;
        const msg = document.getElementById('result-message');
        
        cardElement.classList.add('user-selected');

        if (factData.type === 'FAKE') {
            msg.textContent = "Sharp eye. You caught the forgery.";
            msg.style.color = "var(--accent-gold)";
            cardElement.classList.add('revealed-fake');
        } else {
            msg.textContent = "Deceived. This artifact is authentic.";
            msg.style.color = "var(--text-muted)";
            cardElement.classList.add('revealed-true');
        }

        const allCards = document.querySelectorAll('.artifact-card');
        allCards.forEach((c, i) => {
            const data = gameState.cardsData[i];
            if (data.type === 'FAKE') {
                c.classList.add('revealed-fake');
            } else {
                c.classList.add('revealed-true');
            }
        });

        document.getElementById('next-round-area').classList.remove('hidden');
    }

    // Reset selector visibility on replay
    function resetGame() {
        document.getElementById('domain-select').classList.remove('hidden');
        startGame();
    }

    // Modify the next button to restart properly
    // Note: I bound the next button to startGame() in HTML, but we might want it to show the selector again?
    // Current behavior: "Next Collection" keeps the SAME domain filter. 
    // To let them change domain, we should show the start screen again.
    // Let's modify the Next button behavior in the HTML above to show controls again?
    // Actually, keeping the flow is faster. Let's keep it calling startGame().
    
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }
</script>
</body>
</html>
