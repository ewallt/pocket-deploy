<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etymology Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- THEME DEFINITIONS --- */
        :root {
            /* Default: EXPLORER (Theme 1) */
            --bg-page: #e8dcc8;
            --bg-card: #1a1815;
            --bg-input: #26231f;
            
            --text-title: #d4a574;      
            --title-shadow: 2px 2px 0 #26231f; 
            
            --text-page: #2c2416;       
            --text-card: #faf8f3;       
            --text-muted: #b5a690; /* LIGHTENED for readability on dark cards */
            
            --accent: #d4a574;          
            --accent-contrast: #1a1815; 
            
            --border: #5a5041;
            --chip-bg: #26231f;
            --chip-border: #5a5041;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-page);
            font-family: 'Crimson Text', serif;
            line-height: 1.6;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        h1, h2, h3 { font-weight: 700; }
        .sans { font-family: 'Inter', sans-serif; }

        /* --- THEME GEAR --- */
        .theme-gear {
            position: absolute; top: 1rem; right: 1rem; 
            z-index: 100;
            background: transparent; border: none; cursor: pointer;
            color: var(--text-page); padding: 0.5rem;
            transition: transform 0.4s ease, opacity 0.2s;
            opacity: 0.7;
        }
        .theme-gear:hover { opacity: 1; transform: rotate(90deg); }

        /* --- TYPOGRAPHY --- */
        .app-title {
            color: var(--text-title);
            text-shadow: var(--title-shadow);
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        /* --- CARDS & INPUTS --- */
        .dark-card {
            background-color: var(--bg-card);
            color: var(--text-card);
            border: 1px solid var(--border);
            border-radius: 0.75rem; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            padding: 2rem;
            transition: background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease;
        }

        input[type="text"] {
            background-color: var(--bg-input);
            color: var(--text-card);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            padding: 1rem;
            width: 100%;
            font-family: 'Crimson Text', serif;
            font-size: 1.25rem;
            transition: border-color 0.3s, background-color 0.5s ease, color 0.5s ease;
        }
        input:focus { outline: none; border-color: var(--accent); }
        input::placeholder { color: var(--text-muted); opacity: 0.7; font-style: italic; }

        /* --- BUTTONS --- */
        .action-button {
            background-color: var(--accent);
            color: var(--accent-contrast);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem 2rem;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: opacity 0.2s, transform 0.2s, background-color 0.5s ease, color 0.5s ease;
        }
        .action-button:hover { opacity: 0.9; transform: translateY(-1px); }

        .refresh-btn {
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            padding: 4px;
            transition: transform 0.5s ease, opacity 0.2s;
            opacity: 0.7;
        }
        .refresh-btn:hover { opacity: 1; transform: rotate(180deg); }
        .refresh-btn:disabled { opacity: 0.3; cursor: not-allowed; animation: spin 1s infinite linear; }

        /* --- TREE VISUALS --- */
        .root-node {
            border: 2px solid var(--accent);
            background-color: var(--bg-card);
            color: var(--text-card);
            padding: 1.5rem;
            text-align: center;
            border-radius: 0.5rem;
            transition: all 0.5s ease;
        }

        .timeline-connector {
            width: 2px;
            background: var(--border);
            height: 40px;
            margin: 0 auto;
            transition: background-color 0.5s ease;
        }

        .evolution-step {
            background-color: var(--bg-card);
            color: var(--text-card);
            border: 1px solid var(--border);
            padding: 1rem 1.5rem;
            margin: 0 auto;
            max-width: 500px;
            text-align: center;
            border-radius: 0.5rem;
            transition: all 0.5s ease;
        }

        .arrow-down {
            width: 0; height: 0; 
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid var(--border);
            margin: 0 auto 10px auto;
            transition: border-top-color 0.5s ease;
        }

        .label-text {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 0; 
            transition: color 0.5s ease;
        }

        .cousin-chip {
            display: inline-block;
            background: var(--chip-bg);
            color: var(--text-card);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            margin: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cousin-chip:hover {
            transform: translateY(-2px);
            opacity: 0.9;
            border-color: var(--accent);
        }

        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.8s ease forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .spinner { 
            width: 40px; height: 40px; 
            border: 4px solid var(--bg-input); 
            border-top-color: var(--accent); 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin: 2rem auto; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-4">

    <button onclick="cycleTheme()" class="theme-gear" title="Cycle Themes">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
    </button>

    <header class="text-center mb-8">
        <h1 class="app-title">Etymology Explorer</h1>
        <p class="text-xl italic opacity-80" style="color: var(--text-page)">Excavate the hidden history of words</p>
    </header>

    <div id="view-search" class="w-full max-w-lg dark-card">
        <h2 class="text-2xl mb-6 text-[var(--accent)] border-b border-[var(--border)] pb-2">Start Excavation</h2>
        
        <div class="mb-6">
            <label class="label-text mb-2">1. Target Word</label>
            <input type="text" id="wordInput" placeholder="e.g. Galaxy, Salary, Muscle" onkeypress="handleEnter(event)" autocomplete="off">
        </div>
        
        <button onclick="startExcavation()" class="action-button">Unearth Roots</button>
    </div>

    <div id="view-loading" class="hidden text-center mt-8">
        <div class="spinner"></div>
        <p class="sans text-sm tracking-widest font-bold" style="color: var(--accent)">TRACING LINEAGE...</p>
    </div>

    <div id="view-results" class="hidden w-full max-w-2xl mt-8 fade-in">
        
        <div class="text-center mb-4">
            <span class="label-text" style="font-size: 0.9rem;">The Origin</span>
        </div>
        
        <div class="root-node shadow-lg">
            <div id="root-lang" class="text-xs sans uppercase text-[var(--text-muted)] mb-1">Proto-Indo-European</div>
            <div id="root-term" class="text-3xl font-bold mb-1 italic">*Term</div>
            <div id="root-meaning" class="text-sm text-[var(--text-muted)]">"Meaning"</div>
        </div>

        <div id="evolution-chain" class="mt-0"></div>

        <div class="timeline-connector"></div>
        <div class="arrow-down"></div>
        
        <div class="dark-card text-center" style="border-color: var(--accent);">
            <h2 id="modern-word" class="text-4xl font-bold text-[var(--accent)] mb-2">WORD</h2>
            <p id="modern-def" class="text-lg italic opacity-90">Definition</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-12">
            
            <div class="dark-card p-6">
                <h3 class="label-text mb-4">Linguistic Cousins</h3>
                <div id="cousins-container"></div>
                <p class="text-xs mt-4 italic text-[var(--text-muted)]">Click any word to excavate its history.</p>
            </div>

            <div class="dark-card p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="label-text">Excavator's Note</h3>
                    <button onclick="refreshFact()" id="btn-refresh-fact" class="refresh-btn" title="Dig up another fact">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"></path>
                            <path d="M1 20v-6h6"></path>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                    </button>
                </div>
                <p id="fun-fact" class="text-lg leading-relaxed font-serif"></p>
            </div>

        </div>

        <div class="text-center mt-12 mb-12">
            <button onclick="resetApp()" class="sans text-sm font-bold uppercase tracking-widest hover:underline" style="color: var(--text-page)">Unearth Another</button>
        </div>

    </div>

<script>

    const themes = {
        'explorer': {
            '--bg-page': '#e8dcc8', '--bg-card': '#1a1815', '--bg-input': '#26231f',
            '--text-title': '#d4a574', '--title-shadow': '2px 2px 0 #26231f',
            '--text-page': '#2c2416', '--text-card': '#faf8f3', 
            '--text-muted': '#b5a690', /* Changed from #665648 for better contrast on dark cards */
            '--accent': '#d4a574', '--accent-contrast': '#1a1815',
            '--border': '#5a5041', '--chip-bg': '#26231f', '--chip-border': '#5a5041'
        },
        'archives': {
            '--bg-page': '#f5f5f4', '--bg-card': '#ffffff', '--bg-input': '#e7e5e4',
            '--text-title': '#0f766e', '--title-shadow': 'none',
            '--text-page': '#1c1917', '--text-card': '#1c1917', '--text-muted': '#57534e',
            '--accent': '#0f766e', '--accent-contrast': '#ffffff',
            '--border': '#d6d3d1', '--chip-bg': '#e7e5e4', '--chip-border': '#d6d3d1'
        },
        'high-command': {
            '--bg-page': '#022c22', '--bg-card': '#064e3b', '--bg-input': '#065f46',
            '--text-title': '#fef08a', '--title-shadow': 'none',
            '--text-page': '#ecfdf5', '--text-card': '#ecfdf5', '--text-muted': '#6ee7b7',
            '--accent': '#fef08a', '--accent-contrast': '#022c22',
            '--border': '#065f46', '--chip-bg': '#065f46', '--chip-border': '#10b981'
        },
        'navy': {
            '--bg-page': '#0b1020', '--bg-card': '#111833', '--bg-input': '#1a2347',
            '--text-title': '#8bb9ff', '--title-shadow': 'none',
            '--text-page': '#e6ecff', '--text-card': '#e6ecff', '--text-muted': '#94a3b8',
            '--accent': '#8bb9ff', '--accent-contrast': '#0b1020',
            '--border': '#26325b', '--chip-bg': '#1e293b', '--chip-border': '#334155'
        }
    };

    let currentThemeIndex = 0;
    const themeKeys = Object.keys(themes);

    function cycleTheme() {
        currentThemeIndex = (currentThemeIndex + 1) % themeKeys.length;
        const selectedTheme = themes[themeKeys[currentThemeIndex]];
        
        for (const [key, value] of Object.entries(selectedTheme)) {
            document.documentElement.style.setProperty(key, value);
        }
    }

    function handleEnter(e) { if(e.key === 'Enter') startExcavation(); }

    async function startExcavation() {
        const word = document.getElementById('wordInput').value.trim();
        if(!word) return;

        document.getElementById('view-search').classList.add('hidden');
        document.getElementById('view-results').classList.add('hidden');
        document.getElementById('view-loading').classList.remove('hidden');

        try {
            const prompt = `
                Role: Expert Etymologist.
                Task: Trace the history of the word "${word}".
                
                REQUIREMENTS:
                1. Identify the oldest known ancestor (usually PIE or Proto-Germanic).
                2. Trace 2-3 significant steps in its evolution (e.g., Latin -> Old French).
                3. List 4-5 "Cousin Words" (Cognates) that share the same root but look different.
                4. Provide one fascinating/surprising historical fact about the word's journey.

                RETURN JSON ONLY:
                {
                    "root": { "lang": "Proto-Indo-European", "term": "*bher-", "meaning": "to carry" },
                    "path": [
                        { "lang": "Latin", "term": "ferre", "meaning": "to bear" },
                        { "lang": "Old French", "term": "oferir", "meaning": "to present" }
                    ],
                    "modern": { "word": "${word}", "def": "Concise definition" },
                    "cousins": ["Transfer", "Infer", "Ferry", "Christopher"],
                    "fact": "Interesting historical nuance..."
                }
            `;

            const response = await fetch(
                'https://groq-proxy.ewalltom.workers.dev',
                {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "text/plain" }
                    })
                }
            );

            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text;
            const json = JSON.parse(text.replace(/```json/g, '').replace(/```/g, ''));
            
            renderData(json);

        } catch (e) {
            console.error(e);
            alert("The archives are silent on this word. Try another.");
            resetApp();
        }
    }

    async function refreshFact() {
        const word = document.getElementById('modern-word').textContent;
        const btn = document.getElementById('btn-refresh-fact');
        const factText = document.getElementById('fun-fact');

        // Loading state
        btn.disabled = true;
        factText.style.opacity = '0.5';

        try {
            const prompt = `
                Role: Expert Etymologist.
                Task: Provide a NEW, fascinating historical fact about the word "${word}". 
                It must be different from general dictionary definitions. Focus on a weird usage, a shift in meaning, or a historical anecdote.
                Keep it concise (2-3 sentences).
                Return PLAIN TEXT only.
            `;

            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "text/plain" }
                    })
                }
            );

            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text;
            factText.textContent = text;

        } catch (e) {
            console.error(e);
            alert("Could not dig up a new fact.");
        } finally {
            btn.disabled = false;
            factText.style.opacity = '1';
        }
    }

    function renderData(data) {
        // Root
        document.getElementById('root-lang').textContent = data.root.lang;
        document.getElementById('root-term').textContent = data.root.term;
        document.getElementById('root-meaning').textContent = `"${data.root.meaning}"`;

        // Path
        const chain = document.getElementById('evolution-chain');
        chain.innerHTML = '';
        data.path.forEach(step => {
            chain.innerHTML += `
                <div class="timeline-connector"></div>
                <div class="arrow-down"></div>
                <div class="evolution-step">
                    <div class="text-xs sans uppercase text-[var(--text-muted)] mb-1">${step.lang}</div>
                    <div class="text-xl font-bold">${step.term}</div>
                    <div class="text-sm italic text-[var(--text-muted)]">"${step.meaning}"</div>
                </div>
            `;
        });

        // Modern
        document.getElementById('modern-word').textContent = data.modern.word;
        document.getElementById('modern-def').textContent = data.modern.def;

        // Cousins (Buttons)
        const cousinsContainer = document.getElementById('cousins-container');
        cousinsContainer.innerHTML = '';
        data.cousins.forEach(c => {
            const chip = document.createElement('button');
            chip.className = 'cousin-chip';
            chip.textContent = c;
            chip.onclick = () => {
                document.getElementById('wordInput').value = c;
                startExcavation();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            cousinsContainer.appendChild(chip);
        });

        // Fact
        document.getElementById('fun-fact').textContent = data.fact;

        // Switch Views
        document.getElementById('view-loading').classList.add('hidden');
        document.getElementById('view-results').classList.remove('hidden');
    }

    function resetApp() {
        document.getElementById('wordInput').value = '';
        document.getElementById('view-results').classList.add('hidden');
        document.getElementById('view-search').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
