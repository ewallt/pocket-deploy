<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Response Diagnostics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .card {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            margin: 0 auto;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .btn:hover {
            background: #5568d3;
        }
        .btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
        pre {
            background: #1e293b;
            color: #10b981;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            font-size: 0.85rem;
            max-height: 500px;
            overflow-y: auto;
        }
        .status {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            font-weight: 600;
        }
        .loading { background: #dbeafe; color: #1e40af; }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="text-3xl font-bold text-center mb-4">🔍 API Response Diagnostics</h1>
        <p class="text-center text-gray-600 mb-6">Test Romans 5:12-18 and see the raw API response</p>
        
        <button id="testBtn" class="btn" onclick="runDiagnostic()">
            🚀 Test Romans 5:12-18
        </button>
        
        <div id="status"></div>
        <div id="output"></div>
    </div>

    <script>
        const API_KEY = "AIzaSyBjL7zhEjoBgqCaXCxID3hV9KZNaPm5M8A";

        async function runDiagnostic() {
            const btn = document.getElementById('testBtn');
            const statusDiv = document.getElementById('status');
            const outputDiv = document.getElementById('output');
            
            btn.disabled = true;
            btn.textContent = 'Testing...';
            statusDiv.innerHTML = '<div class="status loading">⏳ Calling API...</div>';
            outputDiv.innerHTML = '';

            const startTime = Date.now();

            try {
                const systemPrompt = `You are a biblical scholar. Analyze Romans 5:12-18.
                
                Return JSON only with these 3 sections (MINIMAL DATA):
                {
                "text_parsing": {
                    "english_text": "ESV text...",
                    "greek_text": "Greek text as single string..."
                },
                "matthew_henry": {
                    "summary": "2-3 sentence summary.",
                    "insights": [{ "title": "Point", "content": "Insight..." }]
                },
                "historical_context": {
                    "notes": [{ "title": "Context Point", "content": "Explanation" }]
                }
                }`;

                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ role: "user", parts: [{ text: systemPrompt }] }],
                            generationConfig: { responseMimeType: "application/json" },
                            safetySettings: [
                                { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                                { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                            ]
                        })
                    }
                );

                const endTime = Date.now();
                const duration = ((endTime - startTime) / 1000).toFixed(1);

                statusDiv.innerHTML = `<div class="status loading">✅ Response received in ${duration}s. Parsing...</div>`;

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();

                // Show full response structure
                outputDiv.innerHTML = `
                    <h3 class="text-xl font-bold mt-6 mb-2">📊 Full API Response Structure:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    
                    <h3 class="text-xl font-bold mt-6 mb-2">🔍 Analysis:</h3>
                    <div class="bg-gray-50 p-4 rounded-lg text-sm">
                        <p><strong>Has candidates?</strong> ${data.candidates ? 'Yes ✅' : 'No ❌'}</p>
                        <p><strong>Candidates count:</strong> ${data.candidates ? data.candidates.length : 0}</p>
                        ${data.candidates && data.candidates[0] ? `
                            <p><strong>Has content?</strong> ${data.candidates[0].content ? 'Yes ✅' : 'No ❌'}</p>
                            ${data.candidates[0].content ? `
                                <p><strong>Has parts?</strong> ${data.candidates[0].content.parts ? 'Yes ✅' : 'No ❌'}</p>
                                ${data.candidates[0].content.parts ? `
                                    <p><strong>Parts count:</strong> ${data.candidates[0].content.parts.length}</p>
                                    ${data.candidates[0].content.parts[0] ? `
                                        <p><strong>Has text?</strong> ${data.candidates[0].content.parts[0].text ? 'Yes ✅' : 'No ❌'}</p>
                                        ${data.candidates[0].content.parts[0].text ? `
                                            <p><strong>Text length:</strong> ${data.candidates[0].content.parts[0].text.length} characters</p>
                                        ` : ''}
                                    ` : '<p class="text-red-600">❌ No parts[0]</p>'}
                                ` : ''}
                            ` : ''}
                        ` : '<p class="text-red-600">❌ No candidates[0]</p>'}
                        ${data.promptFeedback ? `
                            <p class="mt-2 text-red-600"><strong>Prompt Feedback:</strong> ${JSON.stringify(data.promptFeedback)}</p>
                        ` : ''}
                    </div>
                `;

                statusDiv.innerHTML = `<div class="status success">✅ Diagnostic complete in ${duration}s</div>`;

            } catch (error) {
                statusDiv.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
                outputDiv.innerHTML = `<pre>${error.stack}</pre>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Test Romans 5:12-18';
            }
        }
    </script>
</body>
</html>
