<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Inference Hub</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #d4d4d4;
            --accent-color: #0e639c;
            --border-color: #3c3c3c;
        }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        header { padding: 10px 15px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        h1 { margin: 0; font-size: 1.1rem; font-weight: normal; }
        
        button { background: var(--accent-color); color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; font-size: 0.9rem; }
        button:active { transform: translateY(1px); }
        button.secondary { background: #444; }

        /* Main Layout */
        #workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Left Pane: Input/Chat */
        #input-pane { width: 400px; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); background: var(--panel-bg); z-index: 10; }
        #chat-history { flex: 1; padding: 10px; overflow-y: auto; font-size: 0.85rem; scroll-behavior: smooth; }
        
        .msg { margin-bottom: 8px; padding: 8px; border-radius: 4px; word-wrap: break-word; }
        .msg.user { background: #3a3a3a; border-left: 3px solid var(--accent-color); }
        .msg.system { background: #2d2d2d; color: #aaa; font-style: italic; }
        
        #prompt-area { padding: 10px; border-top: 1px solid var(--border-color); background: var(--panel-bg); }
        #user-input { width: 100%; height: 60px; resize: none; margin-bottom: 5px; background: #333; color: white; border: 1px solid var(--border-color); padding: 8px; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        #user-input:focus { outline: 1px solid var(--accent-color); }

        /* Right Pane: App Output */
        #output-pane { flex: 1; padding: 20px; overflow-y: auto; background-color: white; color: black; -webkit-overflow-scrolling: touch; }
        #output-pane h1 { font-size: 1.5rem; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        #output-pane h2 { font-size: 1.2rem; margin-top: 1.5rem; }
        #output-pane code { background: #f0f0f0; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        #output-pane pre { background: #f0f0f0; padding: 10px; overflow-x: auto; border-radius: 4px; }
        #output-pane blockquote { border-left: 4px solid #ddd; margin: 0; padding-left: 10px; color: #555; }

        /* Settings Modal */
        #settings-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        #settings-box { background: var(--panel-bg); padding: 20px; width: 600px; max-width: 90%; border: 1px solid var(--border-color); box-shadow: 0 4px 25px rgba(0,0,0,0.5); border-radius: 8px; }
        .setting-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        textarea.config { width: 100%; height: 150px; background: #333; border: 1px solid var(--border-color); color: white; padding: 10px; box-sizing: border-box; font-family: monospace; border-radius: 4px; }
        
        /* Loader */
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s ease-in-out infinite; margin-left: 10px; display: none;}
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            h1 { font-size: 1rem; }
            
            #workspace { 
                flex-direction: column; 
            }

            /* On mobile, Output goes ON TOP so you can see the result */
            #output-pane { 
                order: 1; 
                height: 60%; 
                padding: 15px;
            }

            /* Input goes ON BOTTOM as a control deck */
            #input-pane { 
                order: 2; 
                width: 100%; 
                height: 40%; 
                border-right: none; 
                border-top: 1px solid var(--border-color);
            }

            /* Make history smaller to prioritize input area */
            #chat-history { font-size: 0.8rem; }
            
            #settings-box { width: 95%; }
            
            /* Better touch targets */
            button { padding: 10px 16px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Universal Hub <span style="font-size:0.7em; opacity:0.6; font-weight:normal;">// Gemini 2.0</span></h1>
    <div>
        <span id="loader" class="spinner"></span>
        <button onclick="toggleSettings()" class="secondary">⚙️ Cartridge</button>
    </div>
</header>

<div id="workspace">
    <div id="input-pane">
        <div id="chat-history">
            <div class="msg system">System: Mobile-Ready. Gemini 2.0 Active.</div>
        </div>
        <div id="prompt-area">
            <textarea id="user-input" placeholder="Enter command..."></textarea>
            <button onclick="runInference()" style="width:100%; margin-top:5px;">Run Inference</button>
        </div>
    </div>
    <div id="output-pane">
        <div style="color:#666; text-align:center; margin-top: 40px;">
            <h3>App View</h3>
            <p style="font-size:0.9rem;">Your Cartridge Output will render here.</p>
        </div>
    </div>
</div>

<div id="settings-overlay">
    <div id="settings-box">
        <h2 style="margin-top:0;">Configuration</h2>
        <div class="setting-group">
            <label>Cartridge (System Prompt)</label>
            <textarea id="system-prompt" class="config" placeholder="You are..."></textarea>
        </div>
        <div style="text-align: right; margin-top:10px;">
            <button onclick="saveSettings()" style="width:100%;">Save & Close</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    // --- Configuration ---
    const API_KEY = "AIzaSyBjL7zhEjoBgqCaXCxID3hV9KZNaPm5M8A";
    
    const CONFIG = {
        systemPrompt: localStorage.getItem('system_prompt') || 'You are a helpful assistant. Render your response in clean HTML within a div.'
    };

    // --- Init ---
    document.getElementById('system-prompt').value = CONFIG.systemPrompt;
    
    // Ctrl+Enter support
    document.getElementById('user-input').addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') runInference();
    });

    // --- UI Logic ---
    function toggleSettings() {
        const el = document.getElementById('settings-overlay');
        el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
    }

    function saveSettings() {
        const prompt = document.getElementById('system-prompt').value;
        localStorage.setItem('system_prompt', prompt);
        CONFIG.systemPrompt = prompt;
        toggleSettings();
        addToHistory("System: Cartridge updated.", "system");
    }

    function addToHistory(text, type) {
        const history = document.getElementById('chat-history');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.textContent = text;
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }

    // --- Inference Engine ---
    async function runInference() {
        const inputEl = document.getElementById('user-input');
        const userText = inputEl.value.trim();
        if (!userText) return;

        // On mobile, dismissing keyboard improves view
        if(window.innerWidth < 768) inputEl.blur();

        addToHistory(userText, 'user');
        inputEl.value = '';
        document.getElementById('loader').style.display = 'inline-block';

        const payload = {
            contents: [{
                role: "user",
                parts: [{ text: CONFIG.systemPrompt + "\n\nUser Input: " + userText }]
            }],
            generationConfig: { temperature: 0.7 }
        };

        try {
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }
            );

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`API Error: ${response.status}`);
            }

            const data = await response.json();
            
            if (!data.candidates || !data.candidates[0]) throw new Error("No response.");

            let rawText = data.candidates[0].content.parts[0].text;
            rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

            const outputPane = document.getElementById('output-pane');
            
            try {
                // Try to parse structured JSON first
                const json = JSON.parse(rawText);
                if (json.html || json.htmlContent) {
                    outputPane.innerHTML = json.html || json.htmlContent;
                } else {
                    outputPane.innerHTML = `<pre>${JSON.stringify(json, null, 2)}</pre>`;
                }
            } catch (e) {
                // Fallback to Markdown
                outputPane.innerHTML = marked.parse(rawText);
            }

        } catch (error) {
            console.error(error);
            addToHistory("Error: " + error.message, 'system');
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }
</script>
</body>
</html>
