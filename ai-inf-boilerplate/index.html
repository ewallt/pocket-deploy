<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Inference Hub</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #d4d4d4;
            --accent-color: #0e639c;
            --border-color: #3c3c3c;
        }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; }
        
        /* Header / Toolbar */
        header { padding: 10px 20px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; font-weight: normal; }
        button { background: var(--accent-color); color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 2px; }
        button:hover { opacity: 0.9; }
        button.secondary { background: #444; }

        /* Main Layout */
        #workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Settings Panel (Hidden by default) */
        #settings-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        #settings-box { background: var(--panel-bg); padding: 20px; width: 600px; max-width: 90%; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .setting-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; background: #333; border: 1px solid var(--border-color); color: white; padding: 8px; box-sizing: border-box; font-family: monospace; }
        textarea { height: 150px; resize: vertical; }

        /* Left Pane: Chat/Input */
        #input-pane { width: 400px; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); background: var(--panel-bg); }
        #chat-history { flex: 1; padding: 10px; overflow-y: auto; font-size: 0.9rem; }
        .msg { margin-bottom: 10px; padding: 8px; border-radius: 4px; }
        .msg.user { background: #3a3a3a; border-left: 3px solid var(--accent-color); }
        .msg.system { background: #2d2d2d; color: #aaa; font-style: italic; }
        #prompt-area { padding: 10px; border-top: 1px solid var(--border-color); }
        #user-input { width: 100%; height: 60px; resize: none; margin-bottom: 5px; }

        /* Right Pane: The "App" View */
        #output-pane { flex: 1; padding: 20px; overflow-y: auto; background-color: white; color: black; }
        /* Simple typography for the rendered view */
        #output-pane h1, #output-pane h2 { border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        #output-pane code { background: #f0f0f0; padding: 2px 4px; border-radius: 3px; }
        #output-pane pre { background: #f0f0f0; padding: 10px; overflow-x: auto; }
        
        /* Loading Indicator */
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-left: 10px; display: none;}
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <h1>Universal Inference Hub</h1>
    <div>
        <span id="loader" class="spinner"></span>
        <button onclick="toggleSettings()" class="secondary">⚙️ Configure Cartridge</button>
    </div>
</header>

<div id="workspace">
    <div id="input-pane">
        <div id="chat-history">
            <div class="msg system">System: Hub ready. Gemini 2.0 Flash Active.</div>
        </div>
        <div id="prompt-area">
            <textarea id="user-input" placeholder="Input parameters or query... (Ctrl+Enter to send)"></textarea>
            <button onclick="runInference()" style="width:100%">Run Inference</button>
        </div>
    </div>
    <div id="output-pane">
        <div style="color:#666; text-align:center; margin-top: 100px;">
            <h3>Waiting for Inference...</h3>
            <p>The output of your "Cartridge" will render here.</p>
        </div>
    </div>
</div>

<div id="settings-overlay">
    <div id="settings-box">
        <h2>Hub Configuration</h2>
        <div class="setting-group">
            <label>The Cartridge (System Instruction)</label>
            <textarea id="system-prompt" placeholder="Define who I am (e.g., 'You are a Math Visualizer...')"></textarea>
        </div>
        <div style="text-align: right;">
            <button onclick="saveSettings()">Save & Close</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    // --- State Management ---
    // Hardcoded API Key as requested
    const API_KEY = "AIzaSyBjL7zhEjoBgqCaXCxID3hV9KZNaPm5M8A";
    
    const CONFIG = {
        systemPrompt: localStorage.getItem('system_prompt') || 'You are a helpful assistant. Render your response in clean HTML within a div.'
    };

    // --- Initialization ---
    document.getElementById('system-prompt').value = CONFIG.systemPrompt;
    
    // Ctrl+Enter to send
    document.getElementById('user-input').addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') runInference();
    });

    // --- Core Logic ---
    function toggleSettings() {
        const el = document.getElementById('settings-overlay');
        el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
    }

    function saveSettings() {
        const prompt = document.getElementById('system-prompt').value;
        localStorage.setItem('system_prompt', prompt);
        CONFIG.systemPrompt = prompt;
        toggleSettings();
        addToHistory("System: Cartridge Updated.", "system");
    }

    function addToHistory(text, type) {
        const history = document.getElementById('chat-history');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.textContent = text;
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }

    // --- UPDATED INFERENCE ENGINE (Gemini 2.0 Flash) ---
    async function runInference() {
        const inputEl = document.getElementById('user-input');
        const userText = inputEl.value.trim();
        if (!userText) return;

        addToHistory(userText, 'user');
        inputEl.value = '';
        document.getElementById('loader').style.display = 'inline-block';

        const payload = {
            contents: [{
                role: "user",
                parts: [{ text: CONFIG.systemPrompt + "\n\nUser Input: " + userText }]
            }],
            generationConfig: {
                // We leave mimetype optional so the Hub can handle both Text and JSON cartridges
                temperature: 0.7
            }
        };

        try {
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }
            );

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`API Error: ${response.status} - ${errorText}`);
            }

            const data = await response.json();
            
            if (data.error) throw new Error(data.error.message);
            if (!data.candidates || !data.candidates[0]) throw new Error("No response generated.");

            let rawText = data.candidates[0].content.parts[0].text;
            
            // Cleanup: remove markdown code blocks if present (common with Flash 2.0)
            rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

            const outputPane = document.getElementById('output-pane');
            
            // Try to parse as JSON first (if the Cartridge was strict)
            try {
                const json = JSON.parse(rawText);
                // If JSON has an 'html' or 'htmlContent' field, render that
                if (json.html || json.htmlContent) {
                    outputPane.innerHTML = json.html || json.htmlContent;
                } else {
                    // Otherwise just show the JSON
                    outputPane.innerHTML = `<pre>${JSON.stringify(json, null, 2)}</pre>`;
                }
            } catch (e) {
                // If not JSON, render as Markdown (Default behavior)
                outputPane.innerHTML = marked.parse(rawText);
            }

        } catch (error) {
            console.error(error);
            addToHistory("Error: " + error.message, 'system');
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }
</script>
</body>
</html>
