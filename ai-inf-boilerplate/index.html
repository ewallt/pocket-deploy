<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Inference Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none;  scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans text-gray-800">

    <div id="configPanel" class="hidden absolute z-50 top-16 right-4 w-96 bg-white shadow-xl rounded-lg border border-gray-200 p-4">
        <h3 class="font-bold text-sm text-gray-500 uppercase mb-2">Hub Context</h3>
        <textarea id="contextDef" class="w-full h-32 text-sm border p-2 rounded mb-2" placeholder="Define what this hub is about...">
This hub is a WWII Command Center.
Items are Major Battles.
Details include Date, Casualties, Victor, and Tactical Summary.
        </textarea>
        <button onclick="saveConfig()" class="w-full bg-blue-600 text-white py-1 rounded hover:bg-blue-700">Update Context</button>
    </div>

    <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">H</div>
            <h1 id="appTitle" class="text-xl font-bold tracking-tight">Inference Hub</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleConfig()" class="p-2 text-gray-400 hover:text-gray-600" title="Edit Context">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <aside class="w-1/3 max-w-sm bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-100 flex gap-2">
                <input type="text" id="searchBox" placeholder="Enter topic (e.g., '1944')..." 
                    class="w-full bg-gray-100 border-none rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                    onkeydown="handleEnterKey(event)">
                <button onclick="triggerSearch()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 rounded-lg font-medium transition-colors">
                    Go
                </button>
            </div>
            <div id="itemList" class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-center text-gray-400 mt-10 text-sm">
                    Enter a topic above and click Go.<br>
                    <span class="text-xs opacity-75">(e.g., "Pacific Theater", "D-Day")</span>
                </div>
            </div>
        </aside>

        <section class="flex-1 overflow-y-auto p-8 relative" id="detailView">
            <div id="emptyState" class="flex flex-col items-center justify-center h-full text-gray-400">
                <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                <p>Select an item to infer details</p>
            </div>
            
            <div id="contentArea" class="hidden max-w-3xl mx-auto fade-in">
                </div>
        </section>

    </main>

    <script>
        // ==========================================
        // 1. CONFIGURATION
        // ==========================================
        
        // PASTE YOUR KEY HERE
        const HARDCODED_KEY = "PASTE_YOUR_API_KEY_HERE"; 
        
        // Default Context
        const DEFAULT_CONTEXT = `
This hub is a WWII Command Center.
Items are Major Battles.
Details include Date, Casualties, Victor, and Tactical Summary.
        `;

        // ==========================================
        // 2. APP LOGIC
        // ==========================================
        
        let CONTEXT = localStorage.getItem('hub_context') || DEFAULT_CONTEXT;
        
        // Initialize UI
        document.getElementById('contextDef').value = CONTEXT;

        function toggleConfig() {
            document.getElementById('configPanel').classList.toggle('hidden');
        }

        function saveConfig() {
            const ctx = document.getElementById('contextDef').value;
            localStorage.setItem('hub_context', ctx);
            location.reload();
        }

        // Handle 'Enter' key press
        function handleEnterKey(e) {
            if (e.key === 'Enter') {
                triggerSearch();
            }
        }

        // Core Search Function
        async function triggerSearch() {
            const query = document.getElementById('searchBox').value;
            if (!query) return;

            document.getElementById('itemList').innerHTML = `<div class="p-4 text-center text-gray-500 animate-pulse">Generating list for "${query}"...</div>`;
            
            // 1. INFERENCE: Generate the List
            const prompt = `
                CONTEXT: ${CONTEXT}
                TASK: Generate a JSON list of 6-10 items relevant to the search query: "${query}".
                IMPORTANT: The output must be a pure JSON Array. No markdown formatting.
                FORMAT EXAMPLE:
                [
                    { "id": "1", "title": "Battle Name", "subtitle": "1942 - Eastern Front" }
                ]
            `;
            
            try {
                const data = await runInference(prompt);
                const items = JSON.parse(cleanJSON(data));
                renderList(items);
            } catch (err) {
                document.getElementById('itemList').innerHTML = `<div class="p-4 text-red-500 text-sm">Error: ${err.message}</div>`;
            }
        }

        function renderList(items) {
            const listEl = document.getElementById('itemList');
            listEl.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'p-3 hover:bg-blue-50 cursor-pointer rounded-lg border border-transparent hover:border-blue-100 transition-colors group';
                div.innerHTML = `
                    <div class="font-semibold text-gray-800 group-hover:text-blue-700">${item.title}</div>
                    <div class="text-xs text-gray-500">${item.subtitle}</div>
                `;
                div.onclick = () => loadDetail(item);
                listEl.appendChild(div);
            });
        }

        async function loadDetail(item) {
            document.getElementById('emptyState').classList.add('hidden');
            const contentArea = document.getElementById('contentArea');
            contentArea.classList.remove('hidden');
            // Skeleton Loader
            contentArea.innerHTML = `<div class="space-y-4">
                <div class="h-8 bg-gray-200 rounded w-1/3 animate-pulse"></div>
                <div class="h-4 bg-gray-200 rounded w-full animate-pulse"></div>
                <div class="h-4 bg-gray-200 rounded w-full animate-pulse"></div>
                <div class="h-64 bg-gray-100 rounded w-full animate-pulse mt-8"></div>
            </div>`;

            // 2. INFERENCE: Generate the Detail
            const prompt = `
                CONTEXT: ${CONTEXT}
                ITEM: ${item.title} (${item.subtitle})
                TASK: Generate a detailed dashboard view for this item.
                FORMAT: Return pure HTML strings. Use Tailwind CSS classes for styling.
                STRUCTURE REQUIREMENTS:
                1. Title (text-3xl font-bold mb-4)
                2. Summary Box (bg-gray-50 p-4 rounded mb-6)
                3. Key Stats Grid (grid grid-cols-2 gap-4 mb-6)
                4. Analysis Section (prose max-w-none)
                NO markdown code blocks. Just the HTML.
            `;

            try {
                const html = await runInference(prompt);
                contentArea.innerHTML = cleanHtml(html);
            } catch (err) {
                contentArea.innerHTML = `<div class="text-red-500">Error: ${err.message}</div>`;
            }
        }

        async function runInference(prompt) {
            if (!HARDCODED_KEY || HARDCODED_KEY.includes("PASTE_YOUR")) { 
                throw new Error("Missing API Key. Edit the HARDCODED_KEY variable in the script."); 
            }
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${HARDCODED_KEY}`;
            const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }] }]
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (!response.ok) {
                 const errData = await response.json();
                 throw new Error(errData.error?.message || response.statusText);
            }

            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        function cleanJSON(text) {
            return text.replace(/```json/g, '').replace(/```/g, '').trim();
        }
        
        function cleanHtml(text) {
            return text.replace(/```html/g, '').replace(/```/g, '').trim();
        }
    </script>
</body>
</html>
