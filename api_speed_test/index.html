<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Speed Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: white;
            border-radius: 1rem;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .success {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
        }
        .error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }
        .loading {
            background: #dbeafe;
            border: 2px solid #3b82f6;
            color: #1e40af;
        }
        .timer {
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            color: #667eea;
            margin: 2rem 0;
            font-variant-numeric: tabular-nums;
        }
        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="text-3xl font-bold text-center mb-2 text-gray-800">⚡ Gemini API Speed Test</h1>
        <p class="text-center text-gray-600 mb-6">Measure response time for a simple "Hello World" request</p>
        
        <button id="testBtn" class="btn" onclick="runTest()">
            🚀 Run Speed Test
        </button>
        
        <div id="timer" class="timer" style="display: none;">0.00s</div>
        <div id="spinner" class="spinner" style="display: none;"></div>
        <div id="result"></div>

        <div class="mt-6 p-4 bg-gray-50 rounded-lg text-sm text-gray-600">
            <strong>Test Details:</strong>
            <ul class="mt-2 space-y-1">
                <li>• Model: gemini-2.0-flash-exp</li>
                <li>• Prompt: "Say hello in exactly 5 words"</li>
                <li>• Response format: JSON</li>
                <li>• Measures: Round-trip time</li>
            </ul>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyBjL7zhEjoBgqCaXCxID3hV9KZNaPm5M8A";
        let startTime, intervalId;

        function updateTimer() {
            const elapsed = (Date.now() - startTime) / 1000;
            document.getElementById('timer').textContent = elapsed.toFixed(2) + 's';
        }

        async function runTest() {
            const btn = document.getElementById('testBtn');
            const resultDiv = document.getElementById('result');
            const timerDiv = document.getElementById('timer');
            const spinnerDiv = document.getElementById('spinner');
            
            // Reset UI
            btn.disabled = true;
            btn.textContent = 'Testing...';
            resultDiv.innerHTML = '';
            timerDiv.style.display = 'block';
            spinnerDiv.style.display = 'block';
            timerDiv.textContent = '0.00s';
            
            // Start timer
            startTime = Date.now();
            intervalId = setInterval(updateTimer, 10);

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{
                                role: "user",
                                parts: [{ text: "Say hello in exactly 5 words. Return JSON: {\"greeting\": \"your 5 word greeting\"}" }]
                            }],
                            generationConfig: { 
                                responseMimeType: "application/json",
                                temperature: 0.5
                            }
                        })
                    }
                );

                const endTime = Date.now();
                clearInterval(intervalId);
                const duration = ((endTime - startTime) / 1000).toFixed(2);
                timerDiv.textContent = duration + 's';

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                if (!data.candidates || !data.candidates[0]) {
                    throw new Error("No response from API");
                }

                let rawText = data.candidates[0].content.parts[0].text;
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const parsed = JSON.parse(rawText);

                // Success
                spinnerDiv.style.display = 'none';
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <div class="text-lg font-bold mb-2">✅ Success!</div>
                    <div><strong>Response Time:</strong> ${duration} seconds</div>
                    <div class="mt-2"><strong>API Response:</strong></div>
                    <div class="mt-1 p-2 bg-white rounded border border-green-300 font-mono text-sm">${parsed.greeting}</div>
                    <div class="mt-3 text-xs opacity-75">
                        <strong>Performance:</strong>
                        ${duration < 2 ? '🚀 Excellent (< 2s)' : 
                          duration < 5 ? '✅ Good (2-5s)' : 
                          duration < 10 ? '⚠️ Slow (5-10s)' : 
                          '🐌 Very Slow (> 10s)'}
                    </div>
                `;

            } catch (error) {
                clearInterval(intervalId);
                spinnerDiv.style.display = 'none';
                
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <div class="text-lg font-bold mb-2">❌ Error</div>
                    <div><strong>Message:</strong> ${error.message}</div>
                    <div class="mt-2 text-xs">
                        This could indicate API key issues, network problems, or rate limiting.
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Run Speed Test';
            }
        }

        // Run test on load (optional - comment out if you don't want auto-run)
        // window.addEventListener('load', () => setTimeout(runTest, 500));
    </script>
</body>
</html>
