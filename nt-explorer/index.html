<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross References Explorer</title>
    <script>
        // Suppress Tailwind production warning
        window.process = { env: { NODE_ENV: 'production' } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #d4a574;
            --dark-bg: #1a1815;
            --cream-text: #faf8f3;
            --muted-gold: rgba(212, 165, 116, 0.8);
            --neutral-bg: #f8fafc;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Crimson Text', Georgia, serif;
            background-color: var(--neutral-bg);
            color: #334155;
            line-height: 1.7;
        }

        h1, h2, h3, h4 {
            font-weight: 600;
            line-height: 1.3;
        }

        h1 { font-size: clamp(2rem, 5vw, 2.75rem); }
        h2 { font-size: clamp(1.5rem, 4vw, 2rem); }

        .generator-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: 'Crimson Text', Georgia, serif;
            transition: border-color 0.2s;
        }

        .generator-input:focus {
            outline: none;
            border-color: var(--primary-gold);
        }

        .example-prompt {
            background-color: #f1f5f9;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border-left: 3px solid var(--primary-gold);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .example-prompt:hover {
            background-color: #e2e8f0;
            transform: translateX(4px);
        }

        .reference-step {
            position: relative;
            padding-left: 3rem;
            margin-bottom: 2rem;
            border-left: 2px solid var(--muted-gold);
        }

        .reference-step:last-child {
            border-left: 2px solid transparent;
        }

        .step-marker {
            position: absolute;
            left: -14px;
            top: 0;
            width: 28px;
            height: 28px;
            background: var(--primary-gold);
            color: var(--dark-bg);
            border-radius: 50%;
            text-align: center;
            font-size: 0.9rem;
            line-height: 28px;
            font-weight: bold;
            box-shadow: 0 0 0 4px white;
        }

        .step-content {
            background-color: var(--dark-bg);
            color: var(--cream-text);
            padding: 1.5rem;
            border-radius: 10px;
            border-left: 4px solid var(--primary-gold);
        }

        .step-content h4 {
            color: var(--primary-gold);
            margin-bottom: 0.5rem;
        }

        .verse-text {
            font-style: italic;
            color: var(--muted-gold);
            margin-top: 0.75rem;
            padding-left: 1rem;
            border-left: 2px solid var(--muted-gold);
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen antialiased">
    <div class="container mx-auto p-4 md:p-6 lg:p-8 max-w-4xl">
        <header class="text-center py-8 mb-6">
            <h1 class="font-bold" style="color: var(--dark-bg);">Cross References Explorer</h1>
            <p class="text-xl mt-2" style="color: #64748b;">Discover Biblical Connections</p>
        </header>

        <main>
            <div class="max-w-3xl mx-auto">
                <div class="text-center mb-10">
                    <h2 class="font-bold" style="color: var(--primary-gold);">Explore Connections</h2>
                    <p class="text-gray-600 mt-2">Enter a Bible passage to discover related verses and their connections.</p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
                    <div class="grid gap-6">
                        <div>
                            <label class="block text-sm font-bold mb-2" style="color: var(--dark-bg);">Bible Passage</label>
                            <input type="text" id="passageInput" class="generator-input" placeholder="E.g., John 3:16 or Romans 8:28-39">
                        </div>

                        <div>
                            <p class="text-sm font-bold mb-3" style="color: var(--dark-bg);">Example Passages:</p>
                            <div class="grid gap-2">
                                <div class="example-prompt" onclick="useExample(this)">John 3:16</div>
                                <div class="example-prompt" onclick="useExample(this)">Romans 8:28-39</div>
                                <div class="example-prompt" onclick="useExample(this)">Psalm 23</div>
                                <div class="example-prompt" onclick="useExample(this)">1 Corinthians 13:4-8</div>
                            </div>
                        </div>

                        <button onclick="exploreCrossReferences()" id="exploreBtn" class="font-bold py-3 px-6 rounded-lg transition-colors shadow-md flex justify-center items-center" style="background-color: var(--primary-gold); color: var(--dark-bg);">
                            <span>Find Cross References</span>
                        </button>
                    </div>
                </div>

                <div id="referencesOutput" class="space-y-4"></div>
            </div>
        </main>

        <footer class="text-center mt-12 py-6 border-t border-gray-300">
            <p class="text-sm text-gray-500">Cross References Explorer v1.0</p>
        </footer>
    </div>

    <script>
        const API_KEY = "AIzaSyBjL7zhEjoBgqCaXCxID3hV9KZNaPm5M8A";

        function useExample(element) {
            document.getElementById('passageInput').value = element.textContent;
        }

        async function exploreCrossReferences() {
            const passage = document.getElementById('passageInput').value;
            const btn = document.getElementById('exploreBtn');
            const output = document.getElementById('referencesOutput');

            if (!passage.trim()) return alert("Please enter a Bible passage.");

            btn.innerHTML = '<div class="spinner"></div>';
            btn.disabled = true;
            output.innerHTML = '';

            try {
                const systemPrompt = `
                    You are a biblical scholar with deep knowledge of Scripture.
                    Task: Find 6-8 meaningful cross-references for the given Bible passage.
                    
                    For each cross-reference, provide:
                    1. The reference (e.g., "Romans 5:8")
                    2. A clear explanation of how it connects to the original passage
                    3. The actual text of the verse
                    
                    Focus on references that:
                    - Share the same theological theme
                    - Use similar language or imagery
                    - Provide context or background
                    - Show fulfillment or echo (OT/NT connections)
                    
                    Format: Return ONLY valid JSON array with no markdown formatting.
                    Schema: 
                    [
                        {
                            "reference": "Romans 5:8",
                            "connection": "Both passages emphasize God's love demonstrated while we were still sinners...",
                            "text": "But God shows his love for us in that while we were still sinners, Christ died for us."
                        },
                        ...
                    ]
                    
                    Be specific about the connection. Don't just say "similar theme" - explain HOW they connect.
                `;

                const userPrompt = `Passage: ${passage}`;

                const payload = {
                    contents: [{
                        role: "user",
                        parts: [{ text: systemPrompt + "\n\n" + userPrompt }]
                    }],
                    generationConfig: { 
                        responseMimeType: "application/json",
                        temperature: 0.7
                    }
                };

                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    }
                );

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                if (!data.candidates || !data.candidates[0]) throw new Error("No response generated.");

                let rawText = data.candidates[0].content.parts[0].text;
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

                const result = JSON.parse(rawText);
                renderReferences(passage, result);

            } catch (e) {
                output.innerHTML = `<div class="p-4 bg-red-50 text-red-600 border border-red-200 rounded">Error: ${e.message}</div>`;
            } finally {
                btn.innerHTML = '<span>Find Cross References</span>';
                btn.disabled = false;
            }
        }

        function renderReferences(originalPassage, references) {
            const output = document.getElementById('referencesOutput');
            let html = `<h3 class="text-2xl font-bold mb-2 text-center" style="color: var(--primary-gold);">Cross References for ${originalPassage}</h3>`;
            html += `<p class="text-center text-gray-600 mb-8">Passages that illuminate and connect</p>`;
            
            references.forEach((ref, index) => {
                html += `
                    <div class="reference-step">
                        <div class="step-marker">${index + 1}</div>
                        <div class="step-content">
                            <h4 class="text-xl font-bold">${ref.reference}</h4>
                            <p class="mt-2 leading-relaxed">${ref.connection}</p>
                            <div class="verse-text">"${ref.text}"</div>
                        </div>
                    </div>
                `;
            });

            output.innerHTML = html;
        }
    </script>
</body>
</html>
