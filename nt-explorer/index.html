            font-size: 1rem;
            white-space: nowrap;
        }

            transform: translateY(-1px);

        }

        .ok-button:disabled {

        }

            margin-bottom: 2rem;
            border-left: 2px solid var(--muted-gold);
        }

            border-left: 2px solid transparent;
