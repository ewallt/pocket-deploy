    <script>
        const API_KEY = "AIzaSyBjL7zhEjoBgqCaXCxID3hV9KZNaPm5M8A"; 
        
        let tooltip;
        let interlinearData = []; 
        let currentPassageRef = ""; 
        let rawHebrewText = ""; 

        // --- 1. TOOLTIP SYSTEM ---
        function createTooltip() {
            if(document.getElementById('hebrewTooltip')) return;
            tooltip = document.createElement('div');
            tooltip.id = 'hebrewTooltip';
            tooltip.style.cssText = `
                position: fixed;
                background: var(--dark-bg);
                color: #faf8f3;
                border: 1px solid var(--primary-gold);
                border-radius: 8px;
                padding: 16px;
                display: none;
                z-index: 10000;
                max-width: 280px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.5);
                font-family: 'Inter', sans-serif;
            `;
            document.body.appendChild(tooltip);
        }

        function showMorphology(element, event) {
            const index = element.dataset.index;
            const data = interlinearData[index];
            if (!data) return;
            
            const safeHebrew = encodeURIComponent(data.h);
            const safeDef = encodeURIComponent(data.d);
            const safeMorph = encodeURIComponent(data.m); 

            tooltip.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:4px; direction: ltr;">
                    <div style="font-size: 1.8rem; color: var(--primary-gold); font-family: 'Noto Serif Hebrew', serif; line-height:1;">${data.h}</div>
                    <div style="font-size: 0.75rem; color: #9ca3af; font-weight:bold; background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px;">${data.m}</div>
                </div>
                <div class="mt-2 text-sm text-white" style="direction: ltr;"><strong>Def:</strong> ${data.d}</div>
                
                <button class="tooltip-btn" 
                    data-hebrew="${safeHebrew}" 
                    data-def="${safeDef}"
                    data-morph="${safeMorph}"
                    onclick="handleDeepStudyClick(this)">
                    Run Deep Study 🔍
                </button>
            `;
            
            const rect = element.getBoundingClientRect();
            let left = rect.left + (rect.width / 2) - 140; 
            let top = rect.bottom + 10;
            
            if (left < 10) left = 10;
            if (left + 280 > window.innerWidth - 10) left = window.innerWidth - 290;
            if (top + 200 > window.innerHeight) top = rect.top - 200 - 10; 
            
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
            tooltip.style.display = 'block';
        }

        function hideTooltip() {
            if(tooltip) tooltip.style.display = 'none';
        }

        // --- 2. DATA FETCHING (2-STEP) ---
        
        // STEP 1: Main Analysis (Fast, Plain Text)
        async function generateAnalysis(passageRef) {
            const systemPrompt = `You are an expert Old Testament scholar. Analyze ${passageRef}.
            
            CRITICAL: 
            1. Provide the Hebrew text as a SINGLE STRING (Masoretic Text). DO NOT parse every word yet.
            2. Use Keil & Delitzsch for commentary.
            3. Find ANE context and NT Connections.
            4. Select 3-4 KEY Hebrew words for 'word_studies'.
            
            Return JSON only:
            {
                "text_parsing": {
                    "english_text": "ESV text...",
                    "hebrew_text": "PLAIN HEBREW STRING HERE"
                },
                "keil_delitzsch": {
                    "summary": "Summary...",
                    "insights": [{ "title": "Point", "content": "Insight" }]
                },
                "nt_connections": {
                    "connections": [{ "type": "Type", "nt_ref": "Ref", "explanation": "Exp" }],
                    "summary": "Summary"
                },
                "historical_context": {
                    "notes": [{ "title": "Title", "content": "Content" }]
                },
                "theological_traditions": {
                    "concepts": [{ "title": "Concept", "traditions": [{ "name": "Trad", "view": "View" }] }]
                },
                "word_studies": {
                    "words": [{ 
                        "hebrew": "Word", 
                        "transliteration": "Trans", 
                        "gloss": "Def", 
                        "morphology": "Morph", 
                        "root": "Root",
                        "stem_significance": "Why?",
                        "semantic_range": "Range", 
                        "usage_note": "Usage", 
                        "theological_weight": "Significance" 
                    }]
                }
            }`;

            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: systemPrompt }] }],
                        generationConfig: { responseMimeType: "application/json" },
                        safetySettings: [ { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" } ]
                    })
                }
            );

            const data = await response.json();
            let rawText = data.candidates[0].content.parts[0].text;
            rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            return JSON.parse(rawText);
        }

        // STEP 2: Interlinear Hydration (Heavy, Optional)
        async function fetchInterlinearData() {
            const btn = document.getElementById('interlinearBtn');
            const spinner = document.getElementById('interlinearSpinner');
            btn.style.display = 'none';
            spinner.style.display = 'block';

            const prompt = `Break down this Hebrew text into an interlinear array for ${currentPassageRef}.
            Text: "${rawHebrewText}"
            
            Return JSON only:
            {
                "interlinear": [
                    { "h": "Word", "m": "MorphCode (e.g. Qal Perf)", "d": "ShortDef" }
                ]
            }`;

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ role: "user", parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    }
                );

                const data = await response.json();
                let text = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                const json = JSON.parse(text);
                
                interlinearData = json.interlinear;
                hydrateHebrewText();
                
                document.getElementById('morphKeyContainer').style.display = 'block';

            } catch (e) {
                console.error(e);
                alert("Could not load interlinear data.");
                btn.style.display = 'block';
                spinner.style.display = 'none';
            }
        }

        function hydrateHebrewText() {
            const container = document.getElementById('hebrewTextContainer');
            const processedHebrew = interlinearData.map((item, index) => {
                return `<span class="hebrew-interactive" data-index="${index}">${item.h}</span>`;
            }).join(' ');
            
            container.innerHTML = processedHebrew;
            attachHebrewListeners();
            document.getElementById('interlinearSpinner').style.display = 'none';
        }

        // --- 3. DEEP STUDY LOGIC (FIXED) ---
        function handleDeepStudyClick(btn) {
            const hebrew = decodeURIComponent(btn.dataset.hebrew);
            const def = decodeURIComponent(btn.dataset.def);
            const morph = decodeURIComponent(btn.dataset.morph); 
            triggerDeepStudy(hebrew, def, morph, btn);
        }

        async function triggerDeepStudy(word, definition, morphCode, btnElement) {
            btnElement.textContent = "Analyzing...";
            btnElement.disabled = true;

            try {
                const prompt = `Perform a theological word study on the Hebrew word "${word}" (${definition}) in context of ${currentPassageRef}.
                Return JSON only: { "hebrew": "${word}", "transliteration": "T", "gloss": "${definition}", "root": "Root", "stem_significance": "Why?", "semantic_range": "Range", "usage_note": "Usage", "theological_weight": "Weight" }`;

                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                    }
                );
                
                const data = await response.json();
                let text = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                
                // FIX: HANDLE ARRAY OR OBJECT
                const parsed = JSON.parse(text);
                const studyData = Array.isArray(parsed) ? parsed[0] : parsed;
                
                addWordStudyCard(studyData, morphCode);
                document.querySelector('.lens-tab[data-lens="words"]').click();
                hideTooltip();

            } catch (error) {
                console.error(error);
                btnElement.textContent = "Error";
                alert("AI Error: Failed to generate study.");
            }
        }

        function addWordStudyCard(w, morphCode) {
            const container = document.querySelector('.lens-content[data-lens-content="words"] .dark-card');
            const titleElement = container.querySelector('h2');
            const morphologyDisplay = morphCode ? `<span class="ml-2 px-2 py-0.5 rounded bg-gray-700 text-xs text-[#c5a065] font-sans">${morphCode}</span>` : "";

            // FIX: ADDED DEFAULTS TO PREVENT UNDEFINED
            const html = `
            <div class="word-study-card mt-6 border-l-[4px] border-[#059669] bg-[#262420] animate-[fadeIn_0.5s_ease-in]">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="hebrew-word text-3xl mb-2 flex items-center gap-2 text-white" style="direction: rtl;">${w.hebrew || '...'}</div>
                        <div class="flex items-center gap-2 mt-1">${morphologyDisplay}<span class="text-sm text-gray-400">Root: ${w.root || 'N/A'}</span></div>
                        <div class="font-medium mt-2 mb-4 text-[#8a7042]">${w.transliteration || ''} • "${w.gloss || ''}"</div>
                    </div>
                    <span class="text-[10px] font-bold uppercase tracking-wider bg-[#059669] text-white px-2 py-1 rounded">New</span>
                </div>
                <div class="space-y-4 text-sm text-gray-200">
                    <div><h4 class="font-bold mb-1 text-[#c5a065]">Stem Significance</h4><p>${w.stem_significance || 'N/A'}</p></div>
                    <div><h4 class="font-bold mb-1 text-[#c5a065]">Usage</h4><p>${w.usage_note || 'N/A'}</p></div>
                    <div><h4 class="font-bold mb-1 text-[#c5a065]">Significance</h4><p>${w.theological_weight || 'N/A'}</p></div>
                </div>
            </div>`;
            titleElement.insertAdjacentHTML('afterend', html);
        }

        // --- 4. RENDERERS ---
        function renderResults(analysis) {
            const container = document.getElementById('lensContainer');
            
            rawHebrewText = analysis.text_parsing.hebrew_text;
            
            container.innerHTML = `
                ${renderTextParsing(analysis.text_parsing)}
                ${renderKeilDelitzsch(analysis.keil_delitzsch)}
                ${renderNTConnections(analysis.nt_connections)}
                ${renderHistoricalContext(analysis.historical_context)}
                ${renderTheologicalTraditions(analysis.theological_traditions)}
                ${renderWordStudies(analysis.word_studies)}
            `;
            
            const tabs = document.querySelectorAll('.lens-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const target = tab.dataset.lens;
                    document.querySelectorAll('.lens-content').forEach(c => {
                        c.classList.remove('active');
                        if(c.dataset.lensContent === target) c.classList.add('active');
                    });
                });
            });
        }

        function renderTextParsing(data) {
            return `
                <section class="lens-content active" data-lens-content="text">
                    <div class="dark-card mb-6">
                        <h2 class="text-xl font-bold mb-4 text-[#c5a065]">English Text (ESV)</h2>
                        <div class="english-text-display text-white/90">${data.english_text}</div>
                    </div>
                    <div class="dark-card mb-6">
                        <h2 class="text-xl font-bold mb-2 text-[#c5a065]">Hebrew Text (BHS)</h2>
                        <div id="hebrewTextContainer" class="biblical-text text-white/95 leading-loose mb-6">
                            ${data.hebrew_text}
                        </div>
                        
                        <div class="border-t border-gray-700 pt-4 text-center">
                            <button id="interlinearBtn" onclick="fetchInterlinearData()" class="btn-secondary w-full md:w-auto text-sm">
                                🔓 Unlock Interlinear (Parsing)
                            </button>
                            <div id="interlinearSpinner" style="display:none;" class="text-sm text-[#d4a574]">
                                Parsing morphology... <span class="loading-spinner inline-block w-4 h-4 ml-2 border-2"></span>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }
        
        function renderKeilDelitzsch(data) {
            if(!data) return '';
            const html = data.insights.map(i => `<div class="mb-4 border-l-2 border-[#8a7042] pl-4"><h4 class="font-bold text-[#c5a065]">${i.title}</h4><p class="text-sm text-gray-300">${i.content}</p></div>`).join('');
            return `<section class="lens-content" data-lens-content="commentary"><div class="dark-card"><h2 class="text-xl font-bold mb-4 text-[#c5a065]">Keil & Delitzsch</h2><div class="bg-[#262420] p-4 rounded mb-6 text-sm italic border border-[#44403c] text-gray-200">"${data.summary}"</div>${html}</div></section>`;
        }
        function renderNTConnections(data) {
             const html = data.connections.map(n => `<div class="p-4 mb-4 rounded border-l-4 border-[#c5a065] bg-[#262420]"><div class="flex justify-between mb-2"><div class="text-xs font-bold text-[#c5a065] uppercase">${n.type}</div><div class="text-xs font-bold text-white bg-gray-700 px-2 rounded">${n.nt_ref}</div></div><div class="text-gray-200 text-sm">${n.explanation}</div></div>`).join('');
            return `<section class="lens-content" data-lens-content="ntconnect"><div class="dark-card"><h2 class="text-xl font-bold mb-4">NT Connections</h2><div class="mb-6 text-sm text-gray-300 italic border-b border-gray-700 pb-4">${data.summary}</div>${html}</div></section>`;
        }
        function renderHistoricalContext(data) {
             return `<section class="lens-content" data-lens-content="context"><div class="dark-card"><h2 class="text-xl font-bold mb-6">ANE Context</h2>${data.notes.map(n => `<div class="word-study-card"><h3 class="font-bold mb-2 text-[#c5a065]">${n.title}</h3><p class="text-sm text-gray-300">${n.content}</p></div>`).join('')}</div></section>`;
        }
        function renderTheologicalTraditions(data) {
            return `<section class="lens-content" data-lens-content="theology"><div class="dark-card"><h2 class="text-xl font-bold mb-6">Traditions</h2>${data.concepts.map(c => `<div class="word-study-card"><h3 class="text-lg font-bold mb-4 text-[#c5a065]">${c.title}</h3>${c.traditions.map(t => `<div class="mb-4"><h4 class="font-semibold text-xs uppercase mb-1 text-gray-400">${t.name}</h4><div class="text-sm text-gray-200">${t.view}</div></div>`).join('')}</div>`).join('')}</div></section>`;
        }
        function renderWordStudies(data) {
            return `<section class="lens-content" data-lens-content="words"><div class="dark-card"><h2 class="text-xl font-bold mb-6">Selected Word Studies</h2>${data.words.map(w => `<div class="word-study-card"><div class="hebrew-word text-3xl mb-2 text-white" style="direction:rtl;">${w.hebrew}</div><div class="font-medium mb-4 text-[#8a7042]">${w.transliteration} • "${w.gloss}"</div><div class="space-y-4 text-sm text-gray-200"><div><h4 class="font-bold text-[#c5a065]">Significance</h4><p>${w.theological_weight}</p></div></div></div>`).join('')}</div></section>`;
        }

        function attachHebrewListeners() {
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            document.querySelectorAll('.hebrew-interactive').forEach(span => {
                if (!isTouch) span.addEventListener('mouseenter', (e) => showMorphology(span, e));
                span.addEventListener('click', (e) => { e.stopPropagation(); showMorphology(span, e); });
            });
            document.addEventListener('click', (e) => { if (tooltip && !tooltip.contains(e.target)) hideTooltip(); });
        }

        // --- 5. MAIN ACTION ---
        function resetApp() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'none';
            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('errorDisplay').style.display = 'none';
            document.getElementById('passageDisplay').textContent = "Ready to Analyze";
            document.getElementById('referenceInput').value = "";
            interlinearData = [];
            document.getElementById('morphKeyContainer').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function analyzePassage() {
            const book = document.getElementById('bookSelect').value;
            const ref = document.getElementById('referenceInput').value;
            if(!book || !ref) { alert("Please enter a reference"); return; }
            
            currentPassageRef = `${book} ${ref}`;
            document.getElementById('passageDisplay').textContent = currentPassageRef;
            
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'block';
            
            // ADDED SCROLL TO TOP
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                const analysis = await generateAnalysis(currentPassageRef);
                renderResults(analysis);
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('resultsSection').style.display = 'block';
                createTooltip();
            } catch (e) {
                console.error(e);
                document.getElementById('errorDisplay').innerText = e.message;
                document.getElementById('errorDisplay').style.display = 'block';
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('inputSection').style.display = 'block';
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('analyzeBtn').addEventListener('click', analyzePassage);
        });
    </script>
