<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Capsule v2.4 (Auto-Scroll)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --app-bg: #f4f1ea;
            --card-bg: #ffffff;
            --input-bg: #e5e7eb;
            --brand: #b91c1c; 
            --text-body: #1f2937;
            --text-head: #111827;
            --text-muted: #6b7280; 
            --border: #d1d5db;
        }

        body {
            font-family: 'Crimson Text', serif;
            background-color: var(--app-bg);
            color: var(--text-body);
            line-height: 1.6;
        }

        h1, h2, h3, h4, .sans-serif { font-family: 'Inter', sans-serif; }

        /* --- UI COMPONENTS --- */
        .card {
            background-color: var(--card-bg); 
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .action-button {
            background-color: var(--brand); color: white;
            font-family: 'Inter', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
            padding: 1rem 2rem; border-radius: 4px; border: none;
            cursor: pointer; transition: all 0.2s; width: 100%; font-size: 1rem;
        }
        .action-button:hover { background-color: #991b1b; }

        input[type="text"] {
            background-color: white; color: var(--text-body);
            border: 2px solid var(--border); border-radius: 4px;
            padding: 1rem; width: 100%; font-family: 'Inter', sans-serif; font-size: 1.25rem; font-weight: 600;
        }
        input:focus { outline: none; border-color: var(--brand); }

        /* --- SECTIONS --- */
        .section-header {
            display: flex; align-items: center; gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }
        .section-title {
            font-family: 'Inter', sans-serif; font-weight: 800; text-transform: uppercase;
            color: var(--brand); font-size: 1.25rem; letter-spacing: -0.02em;
        }

        /* --- LEAD STORY --- */
        #lead-container {
            border-top: 6px solid var(--brand);
            padding: 2rem;
            margin-bottom: 2rem;
            background: #fff;
        }
        .lead-year { font-size: 3rem; font-weight: 900; line-height: 1; color: var(--text-muted); opacity: 0.2; font-family: 'Inter', sans-serif; }
        .lead-headline { font-size: 2.5rem; font-weight: 700; line-height: 1.1; margin: 0.5rem 0 1rem 0; color: var(--text-head); }
        .lead-body { font-size: 1.25rem; color: var(--text-body); }

        /* --- BIRTHS STRIP --- */
        .birth-card {
            background: var(--input-bg); padding: 1rem; border-radius: 4px;
            text-align: center; border: 1px solid var(--border);
        }
        .birth-year { font-family: 'Inter', sans-serif; font-weight: 700; color: var(--brand); font-size: 0.9rem; }
        .birth-name { font-weight: 700; font-size: 1.1rem; margin: 0.25rem 0; line-height: 1.2; }
        .birth-role { font-size: 0.9rem; color: var(--text-muted); font-style: italic; }

        /* --- TIMELINE FEED --- */
        .feed-item {
            display: grid; 
            grid-template-columns: 6rem 1fr; 
            gap: 1rem;
            padding: 1.5rem 0; 
            border-bottom: 1px solid var(--border);
        }
        .feed-year { 
            font-family: 'Inter', sans-serif; font-weight: 800; color: var(--text-head); 
            font-size: 1.1rem; text-align: right; margin-top: 4px;
            word-break: normal;
        }
        .feed-tag {
            display: inline-block; font-size: 0.7rem; font-family: 'Inter', sans-serif; font-weight: 700;
            text-transform: uppercase; color: var(--brand); margin-bottom: 0.25rem;
        }
        .feed-headline { font-size: 1.4rem; font-weight: 700; line-height: 1.2; margin-bottom: 0.5rem; color: var(--text-head); }

        .hidden { display: none !important; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex justify-center">

    <div class="w-full max-w-3xl">
        
        <header class="text-center mb-10">
            <div class="inline-block border-b-4 border-[var(--brand)] px-6 pb-2">
                <h1 class="text-5xl font-black tracking-tighter uppercase text-[var(--text-head)]">The Daily Chronicle</h1>
            </div>
            <p class="mt-3 text-[var(--text-muted)] font-serif italic">Curated history: Year & Date Mode</p>
        </header>

        <div id="view-search" class="card p-8 text-center max-w-xl mx-auto">
            <label class="block text-left font-bold text-[var(--brand)] uppercase text-sm mb-2 font-sans">Enter a Date or Year</label>
            <input type="text" id="dateInput" placeholder="e.g. December 31 or 1984" onkeypress="handleEnter(event)">
            <p class="text-left text-sm text-[var(--text-muted)] mt-2 mb-6">We will curate a Lead Story, 8 Notable Births, and 8 Eclectic Events.</p>
            <button onclick="generateDigest()" class="action-button">Build Chronicle</button>
        </div>

        <div id="view-loading" class="hidden text-center py-20">
            <div class="spinner mb-4"></div>
            <h2 class="text-xl font-bold font-sans">Curating content...</h2>
            <p class="text-[var(--text-muted)] italic">Consulting the archives.</p>
        </div>

        <div id="view-results" class="hidden animate-fade-in">
            
            <div class="flex justify-between items-center mb-6">
                <span id="displayDate" class="font-sans font-bold text-xl uppercase tracking-widest text-[var(--text-muted)]"></span>
                <button onclick="resetApp()" class="text-sm font-bold text-[var(--brand)] hover:underline uppercase font-sans">Enter New Date or Year</button>
            </div>

            <div id="lead-container" class="card"></div>

            <div class="mb-12">
                <div class="section-header">
                    <span class="section-title" id="births-title">Born on This Day</span>
                </div>
                <div id="births-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            </div>

            <div class="mb-12">
                <div class="section-header">
                    <span class="section-title" id="timeline-title">Also in History</span>
                </div>
                <div id="timeline-feed" class="flex flex-col"></div>
            </div>

        </div>

    </div>

<script>
    const API_KEY = "AIzaSyBjL7zhEjoBgqCaXCxID3hV9KZNaPm5M8A"; 

    // --- UTILS ---
    function handleEnter(e) { if(e.key === 'Enter') generateDigest(); }
    
    function parseGeminiJSON(text) {
        try {
            const start = text.indexOf('{');
            const end = text.lastIndexOf('}');
            if (start === -1 || end === -1) throw new Error("Invalid JSON wrapper");
            return JSON.parse(text.substring(start, end + 1));
        } catch(e) {
            console.error("Parse error", e);
            throw e;
        }
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- CORE LOGIC ---
    async function generateDigest() {
        const input = document.getElementById('dateInput').value.trim();
        if(!input) return alert("Please enter a date.");

        // UI Updates
        document.getElementById('view-search').classList.add('hidden');
        document.getElementById('view-loading').classList.remove('hidden');
        
        // Scroll to top to see loading spinner
        scrollToTop();

        // Logic check: Is it a 4-digit Year?
        const isYear = /^\d{4}$/.test(input);

        // Update Headers dynamically
        if (isYear) {
            document.getElementById('births-title').textContent = `Born in ${input}`;
            document.getElementById('timeline-title').textContent = `Events of ${input}`;
        } else {
            document.getElementById('births-title').textContent = "Born on this Day";
            document.getElementById('timeline-title').textContent = "Also on this Date";
        }

        try {
            let prompt;
            
            if (isYear) {
                // --- YEAR MODE PROMPT ---
                prompt = `
                Role: Senior Editor at a History Magazine.
                Task: Create a "Year in Review" for: ${input}.
                
                REQUIREMENTS:
                1. "leadStory": The SINGLE most defining/historic event that happened in ${input}.
                2. "births": List 8 famous people born in ${input}.
                3. "timeline": List 8 diverse events from ${input} (Jan-Dec). Mix Politics, Pop Culture, Tech, and Sports.

                RETURN RAW JSON OBJECT:
                {
                    "leadStory": { "year": "${input}", "headline": "Headline", "story": "Context..." },
                    "births": [ { "year": "${input}", "name": "Name", "role": "Role" } ],
                    "timeline": [ { "year": "Jan 24", "category": "Tech", "headline": "Macintosh Released", "snippet": "..." } ]
                }`;
            } else {
                // --- DATE MODE PROMPT ---
                prompt = `
                Role: Senior Editor at a History Magazine.
                Task: Create a "This Day in History" page for: ${input}.
                
                REQUIREMENTS:
                1. "leadStory": The SINGLE most culturally or politically significant event on this date (any year).
                2. "births": List 8 famous people born on ${input} (any year).
                3. "timeline": List 8 events on ${input}. Eclectic mix (Sports, Crime, Culture). Use "journalistic" headlines.

                RETURN RAW JSON OBJECT:
                {
                    "leadStory": { "year": "1999", "headline": "Headline", "story": "Context..." },
                    "births": [ { "year": "1948", "name": "Name", "role": "Role" } ],
                    "timeline": [ { "year": "1988", "category": "Sports", "headline": "Headline", "snippet": "..." } ]
                }`;
            }

            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
                {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "text/plain" }
                    })
                }
            );

            const data = await response.json();
            const jsonText = data.candidates[0].content.parts[0].text;
            const content = parseGeminiJSON(jsonText);

            renderPage(input, content);

        } catch(err) {
            alert("Error constructing the timeline. Please try again.");
            console.error(err);
            resetApp();
        }
    }

    function renderPage(dateInput, data) {
        document.getElementById('displayDate').textContent = dateInput;

        // 1. Render Lead
        const leadHTML = `
            <div class="lead-year">${data.leadStory.year}</div>
            <h2 class="lead-headline">${data.leadStory.headline}</h2>
            <p class="lead-body">${data.leadStory.story}</p>
        `;
        document.getElementById('lead-container').innerHTML = leadHTML;

        // 2. Render Births
        const birthsContainer = document.getElementById('births-grid');
        birthsContainer.innerHTML = '';
        data.births.forEach(person => {
            const card = document.createElement('div');
            card.className = 'birth-card';
            card.innerHTML = `
                <div class="birth-year">${person.year}</div>
                <div class="birth-name">${person.name}</div>
                <div class="birth-role">${person.role}</div>
            `;
            birthsContainer.appendChild(card);
        });

        // 3. Render Timeline
        const timelineContainer = document.getElementById('timeline-feed');
        timelineContainer.innerHTML = '';
        
        data.timeline.forEach(item => {
            const row = document.createElement('div');
            row.className = 'feed-item';
            row.innerHTML = `
                <div class="feed-year">${item.year}</div>
                <div>
                    <span class="feed-tag">${item.category}</span>
                    <h3 class="feed-headline">${item.headline}</h3>
                    <p class="text-[var(--text-muted)]">${item.snippet}</p>
                </div>
            `;
            timelineContainer.appendChild(row);
        });

        document.getElementById('view-loading').classList.add('hidden');
        document.getElementById('view-results').classList.remove('hidden');
        
        // Scroll to top to see the Lead Story
        scrollToTop();
    }

    function resetApp() {
        document.getElementById('dateInput').value = '';
        document.getElementById('view-results').classList.add('hidden');
        document.getElementById('view-loading').classList.add('hidden');
        document.getElementById('view-search').classList.remove('hidden');
        scrollToTop();
    }
</script>
</body>
</html>
