<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Capsule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --app-bg: #e8dcc8;
            --card-bg: #1a1815;
            --input-bg: #26231f;
            --brand: #d4a574;
            --text-body: #2c2416;
            --text-card: #faf8f3;
            --text-muted: #9ca3af; 
            --border: #5a5041;
            --accent: #eab308;
        }

        body {
            font-family: 'Crimson Text', Georgia, serif;
            background-color: var(--app-bg);
            color: var(--text-body);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- UI COMPONENTS --- */
        h1, h2, h3, h4 { font-weight: 700; }
        
        .theme-gear {
            position: absolute; top: 1rem; right: 1rem; 
            z-index: 100;
            background: transparent; border: none; cursor: pointer;
            color: var(--text-body); padding: 0.5rem;
            transition: transform 0.4s ease;
            opacity: 0.7;
        }
        .theme-gear:hover { opacity: 1; transform: rotate(90deg); }

        .dark-card {
            background-color: var(--card-bg); color: var(--text-card);
            padding: 2rem; border-radius: 0.75rem;
            border-left: 4px solid var(--brand);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            position: relative;
            z-index: 10;
        }

        /* --- INPUTS --- */
        input[type="text"], select {
            background-color: var(--input-bg); color: var(--text-card);
            border: 1px solid var(--border); border-radius: 0.375rem;
            padding: 1rem; width: 100%; font-family: inherit; font-size: 1.25rem;
        }
        input:focus { outline: 2px solid var(--brand); border-color: transparent; }

        .input-wrapper { position: relative; margin-bottom: 1.5rem; }

        /* --- BUTTONS --- */
        .action-button {
            background-color: var(--brand); color: var(--card-bg);
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
            padding: 1rem 2rem; border-radius: 0.375rem; border: none;
            cursor: pointer; transition: all 0.2s; width: 100%; font-size: 1.1rem;
        }
        .action-button:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .action-button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- TIMELINE SPECIFIC --- */
        .timeline-item {
            position: relative;
            padding-left: 2rem;
            border-left: 2px solid var(--border);
            padding-bottom: 2rem;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }
        .timeline-item:last-child { border-left: 2px solid transparent; }
        
        .timeline-dot {
            position: absolute; left: -9px; top: 0;
            width: 16px; height: 16px;
            background-color: var(--brand);
            border-radius: 50%;
            border: 2px solid var(--card-bg);
        }

        .tag-pill {
            display: inline-block; font-size: 0.75rem; 
            text-transform: uppercase; letter-spacing: 0.05em;
            padding: 2px 8px; border-radius: 4px;
            background-color: var(--input-bg); color: var(--text-muted);
            border: 1px solid var(--border); margin-bottom: 0.5rem;
        }

        .hidden { display: none !important; }
        .label-text { display: block; font-size: 0.85rem; font-weight: 700; color: var(--brand); text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.05em; }

        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%; border-top-color: var(--brand);
            animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <button onclick="cycleTheme()" class="theme-gear" title="Switch Theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
    </button>

    <div class="w-full max-w-2xl">
        <header class="text-center mb-8">
            <h1 class="text-5xl mb-2 text-[var(--brand)]" style="text-shadow: 2px 2px 0 var(--input-bg);">Time Capsule</h1>
            <p class="text-xl italic opacity-80">Powered by Gemini AI</p>
        </header>

        <div id="view-search" class="dark-card fade-in">
            <h2 class="text-2xl mb-6 text-[var(--brand)] border-b border-[var(--border)] pb-2">Explore History</h2>
            
            <div class="input-wrapper">
                <label class="label-text">Enter a Date or Year</label>
                <input type="text" id="dateInput" placeholder="e.g., 1969, October 14, or 4th Century BC" autocomplete="off" onkeypress="handleEnter(event)">
                <div class="text-xs text-[var(--text-muted)] mt-2">Try: "March 15", "1492", or "The Summer of Love"</div>
            </div>

            <div class="mb-6">
                <label class="label-text">Focus Area (Optional)</label>
                <select id="focusSelect">
                    <option value="General">General History (Balanced)</option>
                    <option value="War & Politics">War & Politics</option>
                    <option value="Science & Tech">Science & Discovery</option>
                    <option value="Art & Culture">Art, Music & Culture</option>
                    <option value="Obscure">Obscure & Weird Facts</option>
                </select>
            </div>

            <button onclick="startSearch()" class="action-button">Unearth Events</button>
        </div>

        <div id="view-loading" class="dark-card hidden text-center py-12">
            <div class="spinner mb-6"></div>
            <h2 class="text-2xl animate-pulse">Consulting the Archives...</h2>
            <p class="text-[var(--text-muted)] mt-2 italic" id="loadingText">Calibrating flux capacitor...</p>
        </div>

        <div id="view-results" class="dark-card hidden">
            <div class="flex justify-between items-end mb-6 border-b border-[var(--border)] pb-4">
                <div>
                    <span class="label-text">Timeline For</span>
                    <h2 id="resultTitle" class="text-3xl text-[var(--text-card)]"></h2>
                </div>
                <button onclick="resetApp()" class="text-[var(--brand)] text-sm font-bold uppercase hover:underline">New Search</button>
            </div>

            <div id="timelineContainer" class="pl-2">
                </div>
            
            <div class="mt-8 pt-4 border-t border-[var(--border)] text-center">
                 <p class="text-[var(--text-muted)] italic text-sm" id="contextSummary"></p>
            </div>
        </div>

    </div>

<script>
    // --- API & CONFIG ---
    const API_KEY = "AIzaSyBjL7zhEjoBgqCaXCxID3hV9KZNaPm5M8A";

    const themes = {
        'explorer': { '--app-bg': '#e8dcc8', '--card-bg': '#1a1815', '--input-bg': '#26231f', '--brand': '#d4a574', '--text-body': '#2c2416', '--text-card': '#faf8f3', '--text-muted': '#9ca3af', '--border': '#5a5041' },
        'archives': { '--app-bg': '#f5f5f4', '--card-bg': '#e7e5e4', '--input-bg': '#d6d3d1', '--brand': '#0f766e', '--text-body': '#292524', '--text-card': '#292524', '--text-muted': '#57534e', '--border': '#a8a29e' },
        'high-command': { '--app-bg': '#022c22', '--card-bg': '#064e3b', '--input-bg': '#065f46', '--brand': '#fef08a', '--text-body': '#ecfdf5', '--text-card': '#ecfdf5', '--text-muted': '#6ee7b7', '--border': '#065f46' },
        'navy': { '--app-bg': '#0b1020', '--card-bg': '#111833', '--input-bg': '#1a2347', '--brand': '#8bb9ff', '--text-body': '#e6ecff', '--text-card': '#e6ecff', '--text-muted': '#94a3b8', '--border': '#26325b' }
    };

    let currentThemeIndex = 0;
    const themeKeys = Object.keys(themes);

    function cycleTheme() {
        currentThemeIndex = (currentThemeIndex + 1) % themeKeys.length;
        const colors = themes[themeKeys[currentThemeIndex]];
        for (const [key, value] of Object.entries(colors)) {
            document.documentElement.style.setProperty(key, value);
        }
    }

    // --- API HELPERS ---
    function parseGeminiJSON(rawText) {
        try {
            let cleanText = rawText.replace(/```json/g, '').replace(/```/g, '');
            const firstBrace = cleanText.indexOf('['); 
            const lastBrace = cleanText.lastIndexOf(']'); 
            if (firstBrace !== -1 && lastBrace !== -1) {
                cleanText = cleanText.substring(firstBrace, lastBrace + 1);
            }
            return JSON.parse(cleanText);
        } catch (e) {
            console.error("JSON Parse Error", e);
            return [];
        }
    }

    async function callGemini(promptText) {
        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEY}`,
            {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ role: "user", parts: [{ text: promptText }] }],
                    generationConfig: { responseMimeType: "text/plain", temperature: 0.7 }
                })
            }
        );
        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
    }

    // --- APP LOGIC ---

    function handleEnter(e) { if(e.key === 'Enter') startSearch(); }

    function switchView(viewId) {
        ['view-search', 'view-loading', 'view-results'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(viewId).classList.remove('hidden');
    }

    async function startSearch() {
        const input = document.getElementById('dateInput').value.trim();
        const focus = document.getElementById('focusSelect').value;
        
        if (!input) return alert("Please enter a date or year.");

        switchView('view-loading');
        
        const loadingMessages = [
            `Scanning timelines for "${input}"...`, "Consulting the Oracle...",
            "Dusting off old manuscripts...", "Cross-referencing timelines..."
        ];
        let msgIdx = 0;
        const msgInterval = setInterval(() => {
            document.getElementById('loadingText').textContent = loadingMessages[msgIdx % loadingMessages.length];
            msgIdx++;
        }, 1200);

        try {
            const prompt = `
                Role: Expert Historian.
                Task: Find 5-6 significant, interesting, or surprising events associated with the date/year/era: "${input}".
                Focus Area: ${focus}.
                
                Instructions:
                1. If the input is a specific day (e.g. "July 4"), find events that happened on that day across different years.
                2. If the input is a year (e.g. "1999"), find major events from that year.
                3. Sort roughly chronologically.
                
                RETURN RAW JSON ARRAY ONLY. Format:
                [
                    {
                        "year": "1776 (or date)",
                        "headline": "Short punchy title",
                        "description": "2-3 sentences explaining the event's significance.",
                        "category": "Politics"
                    }
                ]
            `;

            const rawText = await callGemini(prompt);
            const events = parseGeminiJSON(rawText);

            if (events.length === 0) throw new Error("Could not parse AI response.");

            clearInterval(msgInterval);
            renderResults(input, events);

        } catch (e) {
            clearInterval(msgInterval);
            console.error("Generation Failed:", e);
            alert(`Error: ${e.message}\n\nPlease try again.`);
            switchView('view-search');
        }
    }

    function renderResults(query, events) {
        document.getElementById('resultTitle').textContent = query;
        const container = document.getElementById('timelineContainer');
        container.innerHTML = '';
        
        events.forEach((ev, index) => {
            const item = document.createElement('div');
            item.className = 'timeline-item';
            item.style.animationDelay = `${index * 150}ms`;
            
            item.innerHTML = `
                <div class="timeline-dot"></div>
                <span class="tag-pill">${ev.category}</span>
                <span class="text-[var(--brand)] font-bold ml-2">${ev.year}</span>
                <h3 class="text-xl text-[var(--text-card)] mt-1 mb-2 leading-tight">${ev.headline}</h3>
                <p class="text-[var(--text-muted)]">${ev.description}</p>
            `;
            container.appendChild(item);
        });

        // Generate a context summary (simulated based on logic for now, could be AI)
        const summary = events.length > 0 
            ? `Found ${events.length} events spanning from ${events[0].year} to ${events[events.length-1].year}.`
            : "No events found.";
        document.getElementById('contextSummary').textContent = summary;

        switchView('view-results');
    }

    function resetApp() {
        document.getElementById('dateInput').value = '';
        switchView('view-search');
    }
</script>
</body>
</html>
